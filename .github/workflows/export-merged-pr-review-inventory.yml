name: Export merged PR review inventory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/export_merged_pr_review_inventory.py
      - tools/pin_merged_pr_review_inventory.py
      - tools/check_merged_pr_review_inventory.py
      - .github/workflows/export-merged-pr-review-inventory.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: merged-pr-review-inventory-main
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact audited main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture audited main identity
        id: audited
        shell: bash
        run: |
          set -euo pipefail
          audited_sha="$(git rev-parse HEAD)"
          echo "sha=${audited_sha}" >> "$GITHUB_OUTPUT"
          echo "Audited main: ${audited_sha}"

      - name: Export authenticated GitHub review inventory
        id: export
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_EXPORT_ATTEMPTS: "4"
          AUDITED_SHA: ${{ steps.audited.outputs.sha }}
        run: |
          set +e
          export_rc=2
          attempts_used=0
          attempt=1

          while [[ "$attempt" -le "$MAX_EXPORT_ATTEMPTS" ]]; do
            attempts_used="$attempt"
            echo "Starting authenticated export attempt ${attempt}/${MAX_EXPORT_ATTEMPTS}."
            rm -rf docs/audits/merged-pr-review-audit

            python tools/export_merged_pr_review_inventory.py \
              --repository "${GITHUB_REPOSITORY}" \
              --audited-sha "${AUDITED_SHA}" \
              --output docs/audits/merged-pr-review-audit
            export_rc=$?

            if [[ "$export_rc" -eq 0 ]]; then
              python tools/pin_merged_pr_review_inventory.py \
                --repository-root . \
                --audited-sha "${AUDITED_SHA}" \
                --inventory docs/audits/merged-pr-review-audit
              export_rc=$?
            fi

            if [[ "$export_rc" -eq 0 ]]; then
              python tools/check_merged_pr_review_inventory.py \
                --root . \
                --expected-main-sha "${AUDITED_SHA}"
              export_rc=$?
            fi

            if [[ "$export_rc" -eq 0 ]]; then
              echo "Authenticated export completed successfully on attempt ${attempt}."
              break
            fi

            if [[ "$export_rc" -ne 2 ]]; then
              echo "Export pipeline returned non-retryable exit code ${export_rc}."
              break
            fi

            if [[ "$attempt" -lt "$MAX_EXPORT_ATTEMPTS" ]]; then
              delay=$((15 * 2 ** (attempt - 1)))
              echo "Export remained incomplete; retrying the full deterministic export in ${delay} seconds."
              sleep "$delay"
            fi

            attempt=$((attempt + 1))
          done

          echo "export_rc=${export_rc}" >> "$GITHUB_OUTPUT"
          echo "attempts=${attempts_used}" >> "$GITHUB_OUTPUT"

          if [[ "$export_rc" -ne 0 && "$export_rc" -ne 2 ]]; then
            exit "$export_rc"
          fi

      - name: Validate generated JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/audits/merged-pr-review-audit")
          required = [
              "raw-pr-inventory.json",
              "raw-review-comments.json",
              "raw-review-submissions.json",
              "raw-review-threads.json",
              "retrieval-manifest.json",
          ]
          for name in required:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"missing generated artifact: {path}")
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Upload raw authenticated export
        uses: actions/upload-artifact@v4
        with:
          name: merged-pr-review-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/audits/merged-pr-review-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Push generated inventory branch
        env:
          EXPORT_BRANCH: audit/authenticated-review-data-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$EXPORT_BRANCH"
          git add docs/audits/merged-pr-review-audit
          if git diff --cached --quiet; then
            echo "No generated inventory changes to commit."
            exit 0
          fi
          git commit -m "Export authenticated merged-PR review inventory"
          git push origin "HEAD:refs/heads/$EXPORT_BRANCH"
          echo "Generated branch: $EXPORT_BRANCH"

      - name: Enforce fail-closed completeness
        if: steps.export.outputs.export_rc != '0'
        run: |
          echo "Authenticated export remained INCOMPLETE after ${{ steps.export.outputs.attempts }} attempt(s)."
          echo "The artifact and generated branch were preserved for diagnosis."
          exit 1
