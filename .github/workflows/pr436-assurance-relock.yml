name: PR436 Assurance Relock

on:
  push:
    branches:
      - agent/close-structured-reasoning-compositional-question
    paths:
      - .github/workflows/pr436-assurance-relock.yml

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-structured-reasoning-compositional-question
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh only the hardened weakening-engine assurance digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock_path = Path('validation_bootstrap/assurance-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          files = lock.get('files')
          target = 'far_validation/weakening.py'
          if not isinstance(files, dict) or target not in files:
              raise SystemExit('protected weakening engine is not present in assurance lock')
          files[target] = hashlib.sha256(Path(target).read_bytes()).hexdigest()
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/pr436-assurance-relock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Relock hardened validator assurance'

      - name: Verify relocked protected validation authority
        shell: bash
        run: |
          set -euo pipefail
          python validation_bootstrap/verify.py
          python -m unittest tests.test_target_category_compositional_invariant -v
          python -m unittest tests.test_target_category_validator_assurance_hardening -v
          python -m pip install -r requirements.txt
          python -m far_validation weakening
          python tools/verify_theory.py
          python tools/repo_health_check.py --fast

      - name: Push only the validated relock
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/close-structured-reasoning-compositional-question
