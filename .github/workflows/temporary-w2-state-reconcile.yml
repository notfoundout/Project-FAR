name: Temporary W2 state reconciliation

on:
  push:
    branches:
      - research/post-w1-infrastructure-w2-formalization

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/post-w1-infrastructure-w2-formalization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reconcile W2 completion metadata and generated views
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          assurance = "internal_deductive_corrected_then_independently_reviewed_exact_scopes_w2_complete_novelty_not_established"
          next_ws = "PCA-W3-CONTRACT-SCHEMA"

          terminal_path = Path("theory/terminal/project-far-core-theory-v1.1.json")
          terminal = json.loads(terminal_path.read_text())
          terminal["assurance"] = assurance
          terminal["next_workstream"] = next_ws
          terminal_path.write_text(json.dumps(terminal, indent=2, ensure_ascii=False) + "\n")

          promotion_path = Path("theory/evaluation/pca-w1-independent-review-promotion-v1.0.json")
          promotion = json.loads(promotion_path.read_text())
          permitted = promotion["reviewed_ledger_contract"]["permitted_current_metadata_values"]
          permitted["assurance"] = assurance
          permitted["next_workstream"] = next_ws
          promotion["next_workstream"] = next_ws
          promotion_path.write_text(json.dumps(promotion, indent=2, ensure_ascii=False) + "\n")

          registry_path = Path("tools/far_research_registry.py")
          text = registry_path.read_text()
          old_assurance_fragment = '            "exact_scopes_w2_partial_novelty_not_established"'
          new_assurance_fragment = '            "exact_scopes_w2_complete_novelty_not_established"'
          if old_assurance_fragment not in text:
              raise SystemExit("expected stale W2 assurance fragment not found")
          text = text.replace(old_assurance_fragment, new_assurance_fragment, 1)
          old_next = '        "next_workstream": "PCA-W2-PROOF-ASSISTANT-FORMALIZATION",'
          new_next = f'        "next_workstream": "{next_ws}",'
          if old_next not in text:
              raise SystemExit("expected reviewed-ledger next-workstream marker not found")
          text = text.replace(old_next, new_next, 1)
          registry_path.write_text(text)
          PY
          python tools/far_research_registry.py --write
          python tools/far_research_registry.py
          python tools/check_project_far_theory_closure.py
          python tools/check_repository_truth.py
      - name: Commit deterministic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add theory/terminal/project-far-core-theory-v1.1.json \
                  theory/evaluation/pca-w1-independent-review-promotion-v1.0.json \
                  tools/far_research_registry.py \
                  docs/planning/opportunity-registry.md \
                  docs/research/research-question-registry.md \
                  docs/assurance/far-core-assurance.md \
                  artifacts/knowledge-graph/project-far-knowledge-graph.json
          if git diff --cached --quiet; then
            echo "No reconciliation changes required"
            exit 0
          fi
          git commit -m "fix: reconcile completed W2 authority and generated views"
          git push origin HEAD:research/post-w1-infrastructure-w2-formalization
