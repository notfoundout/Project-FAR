name: PR 572 One-Shot Remediation

on:
  push:
    branches:
      - codex/complete-project-far-s-living-repository

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply hardened remediation
        run: python tools/_pr572_remediate.py
      - name: Regenerate governed living and corpus outputs
        run: |
          python tools/reconcile_living_repo.py
          python tools/reconcile_research_corpus.py --living-loop --write
      - name: Run focused regression suites
        run: python -m unittest tests.test_living_research tests.test_living_research_workflow tests.test_research_corpus tests.test_pr572_review_regressions -v
      - name: Run governed research check
        run: make research-check
      - name: Commit remediation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "project-far-remediation-bot"
          git config user.email "project-far-remediation-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 0
          fi
          git commit -m "Fix PR 572 hostile-review gaps"
          git push origin "HEAD:${GITHUB_REF_NAME}"
