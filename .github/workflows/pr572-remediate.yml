name: PR572 Remediate Review Findings

on:
  push:
    branches:
      - codex/complete-project-far-s-living-repository

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: codex/complete-project-far-s-living-repository
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Apply reviewed remediation patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr572.patch.gz.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/pr572.patch.gz.b64 | base64 -d | gzip -d > /tmp/pr572.patch
          git apply --check /tmp/pr572.patch
          git apply /tmp/pr572.patch
      - name: Validate and regenerate governed outputs
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python tools/reconcile_living_repo.py
          python tools/reconcile_research_corpus.py --living-loop --write
          python -m unittest tests.test_living_research tests.test_living_research_workflow tests.test_research_corpus -v
          python tools/check_living_research.py
          python tools/check_research_gates.py
      - name: Commit non-workflow remediation
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/living-research.yml .github/workflows/export-pr-checkout.yml
          git config user.name "project-far-remediation-bot"
          git config user.email "project-far-remediation-bot@users.noreply.github.com"
          git add -A
          git commit -m "Fix final living-corpus review findings"
          git push origin HEAD:codex/complete-project-far-s-living-repository
