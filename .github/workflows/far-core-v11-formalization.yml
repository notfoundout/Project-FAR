name: FAR-CORE v1.1 Formalization

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  far-core-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Materialize deterministic W2 completion bundle
        run: python tools/_pca_w2_completion_bundle.py
      - name: Commit deterministic W2 completion bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git add \
            mechanization/lean/FARCoreV11SSS.lean \
            theory/evaluation/far-core-formalization-ledger-v1.0.json \
            theory/evaluation/far-core-assurance-v1.0.json \
            mechanization/lean/FARCoreV11AxiomAudit.lean \
            artifacts/mechanization/lean-inventory-v1.0.json \
            docs/mechanization/far-core-v1.1-formalization.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "formalize: promote FAR-CORE-014 and complete W2 ledger"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Upload W2 completion bundle
        uses: actions/upload-artifact@v4
        with:
          name: pca-w2-completion-${{ github.sha }}
          path: |
            theory/evaluation/far-core-formalization-ledger-v1.0.json
            theory/evaluation/far-core-assurance-v1.0.json
            mechanization/lean/FARCoreV11AxiomAudit.lean
            artifacts/mechanization/lean-inventory-v1.0.json
            docs/mechanization/far-core-v1.1-formalization.md
          if-no-files-found: error
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \
            sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile governed FAR-CORE v1.1 formalization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mechanization
          {
            lean -o mechanization/lean/FARCoreV11Substrate.olean mechanization/lean/FARCoreV11Substrate.lean
            LEAN_PATH=mechanization/lean lean -o mechanization/lean/FARCoreV11Claims001To012.olean mechanization/lean/FARCoreV11Claims001To012.lean
            LEAN_PATH=mechanization/lean lean -o mechanization/lean/FARCoreV11Omega.olean mechanization/lean/FARCoreV11Omega.lean
            LEAN_PATH=mechanization/lean lean -o mechanization/lean/FARCoreV11SSS.olean mechanization/lean/FARCoreV11SSS.lean
            LEAN_PATH=mechanization/lean lean mechanization/lean/FARCoreV11Mutations.lean
          } 2>&1 | tee artifacts/mechanization/far-core-v11-compile.txt
      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: far-core-v11-compile-${{ github.sha }}
          path: artifacts/mechanization/far-core-v11-compile.txt
          if-no-files-found: warn
      - name: Enforce exact transitive kernel assumptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mechanization
          python tools/check_far_core_v11_formalization.py \
            --emit-axiom-audit artifacts/mechanization/FARCoreV11GeneratedAxiomAudit.lean
          LEAN_PATH=mechanization/lean lean \
            artifacts/mechanization/FARCoreV11GeneratedAxiomAudit.lean 2>&1 | \
            tee artifacts/mechanization/far-core-v11-axioms.txt
          python tools/check_far_core_v11_formalization.py \
            --axiom-output artifacts/mechanization/far-core-v11-axioms.txt
      - name: Check ledger and source alignment
        run: python -m unittest tests.test_far_core_v11_formalization -v
