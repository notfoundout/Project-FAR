name: FAR-CORE v1.1 Formalization

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  far-core-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Installer pinned to an immutable elan commit and verified before execution.
          elan_commit=0e36a07b9bbcc5381fa6250df109f9a4f94d7bac
          elan_sha256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl -sSf "https://raw.githubusercontent.com/leanprover/elan/$elan_commit/elan-init.sh" \
            -o "$RUNNER_TEMP/elan-init.sh"
          echo "$elan_sha256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: TEMPORARY measure Lean release asset digests (non-enforcing)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          tmp="$RUNNER_TEMP/lean-measure"; mkdir -p "$tmp"
          for url in \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.zip; do
            name="$(basename "$url")"
            if curl -sSfL "$url" -o "$tmp/$name"; then
              echo "MEASURE $name sha256=$(sha256sum "$tmp/$name" | cut -d' ' -f1) bytes=$(stat -c%s "$tmp/$name")"
            else
              echo "MEASURE $name unavailable"
            fi
          done
          mkdir -p "$tmp/x" && tar --use-compress-program=unzstd -xf "$tmp/lean-4.19.0-linux.tar.zst" -C "$tmp/x" && ls "$tmp/x" && "$tmp/x"/lean-4.19.0-linux/bin/lean --version
      - name: Compile governed FAR-CORE v1.1 formalization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mechanization
          {
            lean -o mechanization/lean/FARCoreV11Substrate.olean mechanization/lean/FARCoreV11Substrate.lean
            LEAN_PATH=mechanization/lean lean -o mechanization/lean/FARCoreV11Claims001To012.olean mechanization/lean/FARCoreV11Claims001To012.lean
            LEAN_PATH=mechanization/lean lean -o mechanization/lean/FARCoreV11Omega.olean mechanization/lean/FARCoreV11Omega.lean
            LEAN_PATH=mechanization/lean lean -o mechanization/lean/FARCoreV11SSS.olean mechanization/lean/FARCoreV11SSS.lean
            LEAN_PATH=mechanization/lean lean mechanization/lean/FARCoreV11Mutations.lean
          } 2>&1 | tee artifacts/mechanization/far-core-v11-compile.txt
      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: far-core-v11-compile-${{ github.sha }}
          path: artifacts/mechanization/far-core-v11-compile.txt
          if-no-files-found: warn
      - name: Enforce exact transitive kernel assumptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mechanization
          python tools/check_far_core_v11_formalization.py \
            --emit-axiom-audit artifacts/mechanization/FARCoreV11GeneratedAxiomAudit.lean
          LEAN_PATH=mechanization/lean lean \
            artifacts/mechanization/FARCoreV11GeneratedAxiomAudit.lean 2>&1 | \
            tee artifacts/mechanization/far-core-v11-axioms.txt
          python tools/check_far_core_v11_formalization.py \
            --axiom-output artifacts/mechanization/far-core-v11-axioms.txt
      - name: Check ledger and source alignment
        run: python -m unittest tests.test_far_core_v11_formalization -v
