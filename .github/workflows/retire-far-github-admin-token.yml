name: Retire FAR GitHub Admin Token

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retire-far-github-admin-token.yml'

permissions:
  actions: write
  contents: read

jobs:
  retire:
    if: github.repository == 'notfoundout/Project-FAR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAR_GITHUB_ADMIN_TOKEN: ${{ secrets.FAR_GITHUB_ADMIN_TOKEN }}
      GITHUB_WORKFLOW_TOKEN: ${{ github.token }}
    steps:
      - name: Retire reusable administrator credential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ.get("GITHUB_REPOSITORY")
          ref = os.environ.get("GITHUB_REF")
          token = os.environ.get("FAR_GITHUB_ADMIN_TOKEN")
          workflow_token = os.environ.get("GITHUB_WORKFLOW_TOKEN")
          expected_repository = "notfoundout/Project-FAR"
          expected_ref = "refs/heads/main"
          required_check = "merge-authority"
          workflows = [
              "canonical-branch-protection.yml",
              "configure-validation-protection.yml",
          ]
          secret_name = "FAR_GITHUB_ADMIN_TOKEN"
          # Activation requires a later protected PR pinning the read-only capture receipt.
          expected_credential_sha256 = ""

          if repository != expected_repository or ref != expected_ref or not workflow_token:
              raise SystemExit("fail-closed repository/ref/read-token precondition")
          credential_sha256 = hashlib.sha256(token.encode()).hexdigest() if token else None
          if token and expected_credential_sha256 and credential_sha256 != expected_credential_sha256:
              raise SystemExit("credential identity differs from the separately authorized fingerprint")

          api = f"https://api.github.com/repos/{repository}"

          class GitHubAPIError(SystemExit):
              def __init__(self, method, path, status):
                  self.status = status
                  super().__init__(f"GitHub API {method} {path} returned {status}")

          def request(method, path, credential):
              req = urllib.request.Request(
                  api + path,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {credential}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  raise GitHubAPIError(method, path, exc.code) from exc
              return json.loads(raw) if raw else {}

          def protection_errors(actual):
              errors = []
              if not isinstance(actual, dict):
                  return ["protection response is not an object"]
              checks = actual.get("required_status_checks")
              if not isinstance(checks, dict):
                  return ["required status checks missing"]
              contexts = checks.get("contexts", []) if isinstance(checks, dict) else []
              if not isinstance(checks, dict) or checks.get("strict") is not True:
                  errors.append("strict required status checks disabled")
              if set(contexts) != {required_check}:
                  errors.append("required status contexts changed")
              if checks.get("checks") != [{"context": required_check, "app_id": 15368}]:
                  errors.append("required status check application changed")
              if actual.get("restrictions") is not None:
                  errors.append("branch restrictions changed")
              admins = actual.get("enforce_admins")
              if not isinstance(admins, dict) or admins.get("enabled") is not True:
                  errors.append("administrator enforcement disabled")
              reviews = actual.get("required_pull_request_reviews")
              expected_reviews = {
                  "dismiss_stale_reviews": True,
                  "require_code_owner_reviews": False,
                  "required_approving_review_count": 0,
                  "require_last_push_approval": False,
              }
              if not isinstance(reviews, dict):
                  errors.append("pull requests not required")
              else:
                  for field, expected in expected_reviews.items():
                      if reviews.get(field) != expected:
                          errors.append(f"pull request control {field} changed")
                  for field in ("bypass_pull_request_allowances", "dismissal_restrictions"):
                      if any(reviews.get(field, {}).values()):
                          errors.append(f"unexpected pull request allowance {field}")
              expected_flags = {
                  "required_conversation_resolution": True,
                  "required_linear_history": False,
                  "allow_force_pushes": False,
                  "allow_deletions": False,
                  "block_creations": False,
                  "required_signatures": False,
                  "lock_branch": False,
                  "allow_fork_syncing": False,
              }
              for field, expected in expected_flags.items():
                  value = actual.get(field)
                  enabled = value.get("enabled") if isinstance(value, dict) else None
                  if enabled is not expected:
                      errors.append(f"branch protection control {field} changed")
              return errors

          branch = urllib.parse.quote("main", safe="")

          def issuer_status():
              req = urllib.request.Request(
                  "https://api.github.com/user",
                  headers={"Accept": "application/vnd.github+json",
                           "Authorization": f"Bearer {token}",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  if exc.code == 401:
                      return 401
                  raise SystemExit(f"issuer authentication verification returned {exc.code}") from exc
              if status != 200:
                  raise SystemExit(f"unexpected issuer authentication status {status}")
              return status

          def revoke_exact_token():
              if (not expected_credential_sha256
                  or credential_sha256 != expected_credential_sha256
                  or not token.startswith(("ghp_", "github_pat_"))):
                  raise SystemExit("only the exact obsolete personal access token may be revoked")
              req = urllib.request.Request(
                  "https://api.github.com/credentials/revoke",
                  data=json.dumps({"credentials": [token]}).encode("utf-8"),
                  method="POST",
                  headers={"Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"issuer revocation request returned {exc.code}") from exc
              if status != 202:
                  raise SystemExit(f"unexpected issuer revocation status {status}")

          def control_summary():
              states = {}
              for workflow in workflows:
                  encoded = urllib.parse.quote(workflow, safe="")
                  state = request("GET", f"/actions/workflows/{encoded}", workflow_token).get("state")
                  states[workflow] = state
                  if state != "disabled_manually":
                      raise SystemExit(
                          f"recovery requires workflow {workflow} disabled_manually, got {state!r}"
                      )
              branch_state = request("GET", f"/branches/{branch}", workflow_token)
              summary = branch_state.get("protection", {})
              checks = summary.get("required_status_checks", {})
              contexts = checks.get("contexts", []) if isinstance(checks, dict) else []
              if (
                  branch_state.get("protected") is not True
                  or summary.get("enabled") is not True
                  or checks.get("enforcement_level") != "everyone"
                  or set(contexts) != {required_check}
                  or checks.get("checks") != [{"context": required_check, "app_id": 15368}]
              ):
                  raise SystemExit("credentialless recovery branch-protection summary mismatch")
              return states

          def recovery(mode, secret_absent):
              states = control_summary()
              receipt = {
                  "branch": "main",
                  "branch_protection_summary_enforced": True,
                  "mode": mode,
                  "privileged_workflow_states": states,
                  "repository": repository,
                  "secret_absent": secret_absent,
                  "secret_name": secret_name,
              }
              if secret_absent:
                  receipt["secret_absence_evidence"] = "trusted main push did not inject the repository secret"
              else:
                  receipt["credential_authentication_http_status"] = 401
                  receipt["credential_usable"] = False
                  receipt["credential_sha256"] = hashlib.sha256(token.encode()).hexdigest()
              print(json.dumps(receipt, indent=2, sort_keys=True), flush=True)

          if not token:
              recovery("credentialless_recovery", True)
              raise SystemExit(0)
          try:
              before = request("GET", f"/branches/{branch}/protection", token)
          except GitHubAPIError as exc:
              if exc.status != 401 or issuer_status() != 401:
                  raise
              recovery("invalidated_credential_recovery", False)
              raise SystemExit(0)
          before_errors = protection_errors(before)
          if before_errors:
              raise SystemExit("pre-retirement protection mismatch: " + "; ".join(before_errors))

          if not expected_credential_sha256:
              states = control_summary()
              after = request("GET", f"/branches/{branch}/protection", token)
              if protection_errors(after) or before != after:
                  raise SystemExit("identity capture requires unchanged full protection")
              print(json.dumps({
                  "mode": "credential_identity_capture",
                  "credential_sha256": credential_sha256,
                  "repository": repository,
                  "branch": "main",
                  "secret_name": secret_name,
                  "secret_absent": False,
                  "retirement_accepted": False,
                  "branch_protection": after,
                  "branch_protection_sha256": hashlib.sha256(
                      json.dumps(after, sort_keys=True, separators=(",", ":")).encode()
                  ).hexdigest(),
                  "branch_protection_unchanged_and_enforced": True,
                  "privileged_workflow_states": states,
              }, indent=2, sort_keys=True), flush=True)
              raise SystemExit(0)

          for workflow in workflows:
              encoded = urllib.parse.quote(workflow, safe="")
              request("PUT", f"/actions/workflows/{encoded}/disable", workflow_token)

          states = {}
          for workflow in workflows:
              encoded = urllib.parse.quote(workflow, safe="")
              state = request("GET", f"/actions/workflows/{encoded}", workflow_token).get("state")
              states[workflow] = state
              if state != "disabled_manually":
                  raise SystemExit(f"workflow {workflow} state is {state!r}, expected disabled_manually")

          after = request("GET", f"/branches/{branch}/protection", token)
          after_errors = protection_errors(after)
          if after_errors:
              raise SystemExit("post-disable protection mismatch: " + "; ".join(after_errors))
          if after != before:
              raise SystemExit("branch protection changed during retirement")

          encoded_secret = urllib.parse.quote(secret_name, safe="")
          receipt = {
              "branch": "main",
              "branch_protection_unchanged_and_enforced": True,
              "branch_protection": after,
              "branch_protection_sha256": hashlib.sha256(
                  json.dumps(after, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest(),
              "privileged_workflow_states": states,
              "repository": repository,
              "secret_name": secret_name,
              "credential_sha256": hashlib.sha256(token.encode()).hexdigest(),
          }
          try:
              request("DELETE", f"/actions/secrets/{encoded_secret}", token)
          except GitHubAPIError as exc:
              if exc.status != 403:
                  raise
              try:
                  request("DELETE", f"/actions/secrets/{encoded_secret}", workflow_token)
              except GitHubAPIError as workflow_exc:
                  if workflow_exc.status != 403:
                      raise
              else:
                  receipt.update(mode="workflow_token_deletion", secret_absent=True,
                                 secret_absence_evidence="GitHub Actions secret DELETE returned success with the short-lived workflow token")
                  print(json.dumps(receipt, indent=2, sort_keys=True), flush=True)
                  raise SystemExit(0)
              receipt.update(mode="revocation_pending", secret_absent=False,
                             repository_secret_delete_http_status=403,
                             workflow_token_secret_delete_http_status=403)
              # Preserve the full verified policy before invalidating the only admin credential.
              print(json.dumps(receipt, indent=2, sort_keys=True), flush=True)
              revoke_exact_token()
              receipt.update(mode="revocation_requested", revocation_http_status=202)
              print(json.dumps(receipt, indent=2, sort_keys=True), flush=True)
              for attempt in range(61):
                  if issuer_status() == 401:
                      break
                  if attempt == 60:
                      raise SystemExit("issuer revocation pending after bounded verification; rerun to recover")
                  time.sleep(5)
              receipt["privileged_workflow_states"] = control_summary()
              receipt.update(mode="issuer_revocation", credential_usable=False,
                             revocation_http_status=202, credential_authentication_http_status=401,
                             post_revocation_protection_summary_enforced=True,
                             full_policy_verified_before_credential_invalidation=True)
          else:
              receipt.update(mode="admin_retirement", secret_absent=True,
                             secret_absence_evidence="GitHub Actions secret DELETE returned success")
          print(json.dumps(receipt, indent=2, sort_keys=True), flush=True)
          PY
