name: PR438 root closure repair

on:
  push:
    branches:
      - repair/pr435-final-contract-closure

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: repair/pr435-final-contract-closure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Reconcile schema 1.6 verifier and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          pkg = root / 'research/external-validation/swe-agent-v3'
          verifier = pkg / 'verify_review_closure.py'
          text = verifier.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '        "1.5", "FAR-SWE-V3-001", "Research", "uninstantiated"',
              '        "1.6", "FAR-SWE-V3-001", "Research", "uninstantiated"',
              'schema version',
          )
          replace_once(
              'exact task manifest bytes and Git blob identity must be committed and independently reviewed before any sacrificial pilot or confirmatory execution; freezing or changing task identity, order, repository identity, strata, or the sealed identity ledger after any agent run is prohibited even if outcomes or grades remain concealed',
              'exact task manifest bytes and Git blob identity must be committed and independently reviewed before any sacrificial pilot or confirmatory execution; freezing or changing task identity, order, repository identity, strata, repository-prohibition evidence, or the sealed identity ledger after any agent run is prohibited even if outcomes or grades remain concealed',
              'freeze timing',
          )

          constants = r'''EXPECTED_LEDGER_CONTRACT = {
              "status": "uninstantiated",
              "execution_authorized": False,
              "media_type": "application/json",
              "top_level_type": "array",
              "record_required_keys_exactly": [
                  "blind_task_id", "repository_blind_id", "task_bundle_root_sha256", "repository_provider",
                  "repository_provider_id", "canonical_repository_url", "repository_commit_sha",
                  "task_payload_sha256", "task_payload_bytes", "strata",
                  "github_fork_source_repository_id", "contains_project_far_treatment_material",
              ],
              "array_binding_rule": "there is exactly one ledger record for every task-manifest record and no extras; ledger array position, blind_task_id, repository_blind_id, task_bundle_root_sha256, and strata must exactly match the corresponding frozen task-manifest record",
              "descriptor_binding_rule": "the seven descriptor fields algorithm_id=far-swe-v3-task-bundle-root-v2 plus repository_provider, repository_provider_id, canonical_repository_url, repository_commit_sha, task_payload_sha256, and task_payload_bytes reconstructed from each ledger record must recompute that record's task_bundle_root_sha256 exactly",
              "repository_binding_rule": "repository_provider must be exactly github.com and repository_provider_id must be a positive JSON integer independently resolved from api.github.com before freeze; equal provider/id pairs must use the same repository_blind_id and canonical_repository_url, distinct provider/id pairs must use distinct repository_blind_id values, and one canonical_repository_url may not map to multiple provider/id pairs",
              "population_rule": "minimum repository count and per-repository task cap are computed from distinct (repository_provider, repository_provider_id) pairs in this sealed ledger, never URL spellings or blind labels alone",
              "prohibited_repository_binding_rule": "every ledger record must satisfy prohibited_repository_contract: repository_provider_id must not equal the Project FAR repository ID, github_fork_source_repository_id must not equal the Project FAR repository ID, and contains_project_far_treatment_material must be boolean false",
              "access_control": "ledger contents containing repository and task identity material are sealed from the agent and capsule authors; only the independent preexecution identity auditor and explicitly authorized evidence custodians may access them before scoring freeze",
              "freeze_timing": "the exact ledger bytes and Git blob identity are committed before any sacrificial pilot or confirmatory execution and before any task identity is released to an executing agent",
              "launch_binding": "the separate prospective pilot or confirmatory launch record must name both the frozen task-manifest Git blob identity and frozen sealed-identity-ledger Git blob identity plus the retained repository-prohibition audit report root",
              "retention_rule": "the exact sealed ledger bytes, Git blob identity, independent validation report, and repository-prohibition audit report are retained in the experiment evidence store for post-run audit",
          }
          EXPECTED_PROHIBITED_REPOSITORY_CONTRACT = {
              "project_far_repository_provider": "github.com",
              "project_far_repository_provider_id": 1283452680,
              "reject_exact_project_far_repository": True,
              "reject_github_fork_source_project_far": True,
              "require_project_far_treatment_material_absent": True,
              "github_fork_source_rule": "github_fork_source_repository_id is null for a non-fork or a positive JSON integer equal to api.github.com source.id for a GitHub fork; a value equal to project_far_repository_provider_id is prohibited",
              "treatment_material_audit_rule": "before freeze, the independent task-identity auditor inspects the exact candidate repository commit for Project FAR treatment material using the frozen FAR capsule and current Project FAR source artifacts as the reference set; contains_project_far_treatment_material must be boolean false and the audit report is retained and launch-bound",
              "canonical_url_uniqueness_rule": "one authoritative (repository_provider, repository_provider_id) pair must map to exactly one canonical_repository_url and one canonical_repository_url must map to exactly one authoritative pair within the frozen sealed identity ledger",
              "failure_rule": "any exact Project FAR repository, Project FAR GitHub fork-source match, treatment-material-positive audit, canonical-URL/provider-ID inconsistency, or unavailable required prohibition evidence rejects the task population before execution",
          }
          EXPECTED_REPOSITORY_IDENTITY = {
              "supported_provider": "github.com only",
              "authoritative_identity": "the ordered pair (repository_provider, repository_provider_id), where repository_provider is exactly the JSON string github.com and repository_provider_id is a positive JSON integer equal to the api.github.com REST repository id resolved before freeze; URL strings and repository_blind_id labels are never repository identities",
              "github_identity_rule": "repository_provider must equal github.com exactly and repository_provider_id must be a positive JSON integer equal to the decimal GitHub REST repository id; strings, owner/repository text, host aliases, self-hosted GitHub instances, path-case variants, default-port variants, .git suffixes, redirects, and renames cannot create distinct repository identities",
              "canonical_url_rule": "canonical_repository_url must equal https://github.com/{full_name} using the full_name returned by api.github.com for the authoritative repository id at freeze time and is retained only for auditability; each authoritative provider/id pair has exactly one canonical URL in the ledger and each canonical URL maps to exactly one authoritative pair",
              "equal_authoritative_identities_same_blind_id": True,
              "distinct_authoritative_identities_distinct_blind_ids": True,
              "minimum_repository_count_basis": "count distinct (repository_provider, repository_provider_id) pairs in the sealed identity ledger, never URL strings or repository_blind_id labels alone",
              "per_repository_cap_basis": "apply the preregistered per-repository task cap by the same (repository_provider, repository_provider_id) pair in the sealed identity ledger before execution",
              "validation_timing": "validate every github.com repository identity from api.github.com, canonical URL one-to-one mapping, the ledger-to-manifest one-to-one binding, unique task-bundle roots, Project FAR repository/fork/treatment-material prohibitions, minimum repository count, per-repository cap, and required-strata coverage before any sacrificial pilot or confirmatory execution",
          }
          '''
          text, count = re.subn(
              r'EXPECTED_LEDGER_CONTRACT = \{.*?\nEXPECTED_ORDER = \{',
              constants + 'EXPECTED_ORDER = {',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('expected contract constant block not found exactly once')

          preexecution = r'''EXPECTED_PREEXECUTION = [
              "record keys match the exact schema",
              "blind task identifiers are unique",
              "task bundle roots are unique so one authoritative task identity cannot occupy multiple manifest records or bootstrap units",
              "every strata value is a nonempty duplicate-free canonical-order subset of bug_fix, test_failure, behavioral_regression, API_or_contract_change, multi_file_change",
              "the union of strata across the frozen confirmatory task manifest covers bug_fix, test_failure, behavioral_regression, API_or_contract_change, and multi_file_change before execution",
              "all identifiers match their ASCII fixed-width patterns",
              "all task bundle roots are lowercase 64-character SHA-256 hex",
              "the sealed identity ledger contains exactly one record for every frozen task-manifest record, in the same array order, with exact matching blind identifiers, task root, and strata",
              "every task bundle root is independently recomputed from the corresponding sealed identity-ledger descriptor",
              "every repository_provider is exactly github.com and every repository_provider_id is a positive JSON integer independently resolved from api.github.com before counting or blind-ID assignment",
              "every canonical repository URL is derived from the authoritative GitHub repository id and returned full_name before counting or blind-ID assignment",
              "equal authoritative repository identities use the same repository blind ID and canonical URL, distinct authoritative identities use distinct blind IDs, and one canonical URL never maps to multiple authoritative identities",
              "no ledger repository_provider_id equals the Project FAR repository provider ID, no github_fork_source_repository_id equals it, and every contains_project_far_treatment_material value is boolean false under the retained independent prohibition audit",
              "minimum repository count and per-repository cap are computed from authoritative provider-stable repository identities in the sealed identity ledger rather than URL spellings or blind-ID label count",
              "the exact task manifest artifact bytes, sealed identity-ledger bytes, both Git blob identities, and repository-prohibition audit report root are committed before any sacrificial pilot or confirmatory execution",
          ]
          '''
          text, count = re.subn(
              r'EXPECTED_PREEXECUTION = \[.*?\n\]\nLAUNCH_BINDINGS = \[',
              preexecution + 'LAUNCH_BINDINGS = [',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('expected preexecution block not found exactly once')

          replace_once(
              '    integrity._require_type_exact(data.get("sealed_identity_ledger_contract"), EXPECTED_LEDGER_CONTRACT, "sealed task identity ledger contract")\n'
              '    integrity._require_type_exact(data.get("repository_identity_contract"), EXPECTED_REPOSITORY_IDENTITY, "repository identity contract")',
              '    integrity._require_type_exact(data.get("prohibited_repository_contract"), EXPECTED_PROHIBITED_REPOSITORY_CONTRACT, "prohibited repository contract")\n'
              '    integrity._require_type_exact(data.get("sealed_identity_ledger_contract"), EXPECTED_LEDGER_CONTRACT, "sealed task identity ledger contract")\n'
              '    integrity._require_type_exact(data.get("repository_identity_contract"), EXPECTED_REPOSITORY_IDENTITY, "repository identity contract")',
              'prohibited repository semantic lock',
          )

          replace_once(
              '    provider_to_blind: dict[tuple[str, int], str] = {}\n'
              '    blind_to_provider: dict[str, tuple[str, int]] = {}\n'
              '    repo_counts: Counter[tuple[str, int]] = Counter()',
              '    provider_to_blind: dict[tuple[str, int], str] = {}\n'
              '    blind_to_provider: dict[str, tuple[str, int]] = {}\n'
              '    provider_to_url: dict[tuple[str, int], str] = {}\n'
              '    url_to_provider: dict[str, tuple[str, int]] = {}\n'
              '    repo_counts: Counter[tuple[str, int]] = Counter()',
              'ledger bijection maps',
          )
          replace_once(
              '        if identity["repository_provider"] != "github.com" or type(identity["repository_provider_id"]) is not int or identity["repository_provider_id"] <= 0:\n'
              '            raise DesignError("sealed ledger requires github.com plus positive integer REST repository id")\n'
              '        url = identity["canonical_repository_url"]',
              '        if identity["repository_provider"] != "github.com" or type(identity["repository_provider_id"]) is not int or identity["repository_provider_id"] <= 0:\n'
              '            raise DesignError("sealed ledger requires github.com plus positive integer REST repository id")\n'
              '        if identity["repository_provider_id"] == EXPECTED_PROHIBITED_REPOSITORY_CONTRACT["project_far_repository_provider_id"]:\n'
              '            raise DesignError("Project FAR repository is prohibited from the task population")\n'
              '        fork_source = identity["github_fork_source_repository_id"]\n'
              '        if fork_source is not None and (type(fork_source) is not int or fork_source <= 0):\n'
              '            raise DesignError("GitHub fork source repository id must be null or a positive integer")\n'
              '        if fork_source == EXPECTED_PROHIBITED_REPOSITORY_CONTRACT["project_far_repository_provider_id"]:\n'
              '            raise DesignError("Project FAR forks are prohibited from the task population")\n'
              '        treatment_material = identity["contains_project_far_treatment_material"]\n'
              '        if type(treatment_material) is not bool or treatment_material is not False:\n'
              '            raise DesignError("Project FAR treatment material must be independently audited absent")\n'
              '        url = identity["canonical_repository_url"]',
              'repository prohibition enforcement',
          )
          replace_once(
              '        if blind_id in blind_to_provider and blind_to_provider[blind_id] != provider_id:\n'
              '            raise DesignError("one repository blind ID maps to multiple authoritative repositories")\n'
              '        provider_to_blind[provider_id] = blind_id; blind_to_provider[blind_id] = provider_id; repo_counts[provider_id] += 1',
              '        if blind_id in blind_to_provider and blind_to_provider[blind_id] != provider_id:\n'
              '            raise DesignError("one repository blind ID maps to multiple authoritative repositories")\n'
              '        if provider_id in provider_to_url and provider_to_url[provider_id] != url:\n'
              '            raise DesignError("one authoritative repository maps to multiple canonical URLs")\n'
              '        if url in url_to_provider and url_to_provider[url] != provider_id:\n'
              '            raise DesignError("one canonical URL maps to multiple authoritative repositories")\n'
              '        provider_to_blind[provider_id] = blind_id\n'
              '        blind_to_provider[blind_id] = provider_id\n'
              '        provider_to_url[provider_id] = url\n'
              '        url_to_provider[url] = provider_id\n'
              '        repo_counts[provider_id] += 1',
              'canonical URL bijection enforcement',
          )
          verifier.write_text(text, encoding='utf-8', newline='\n')

          tests = root / 'tests/test_swe_agent_v3_single_source_integrity.py'
          body = tests.read_text(encoding='utf-8')
          if body.count('"strata": [STRATA[i % len(STRATA)]],') != 1:
              raise SystemExit('fixture insertion anchor drifted')
          body = body.replace(
              '            "strata": [STRATA[i % len(STRATA)]],',
              '            "strata": [STRATA[i % len(STRATA)]],\n'
              '            "github_fork_source_repository_id": None,\n'
              '            "contains_project_far_treatment_material": False,',
              1,
          )
          body = body.replace('def test_schema_1_5_identity_strata_and_sealed_ledger_contract_is_preserved', 'def test_schema_1_6_identity_strata_and_sealed_ledger_contract_is_preserved', 1)
          body = body.replace('self.assertEqual(data["schema_version"], "1.5")', 'self.assertEqual(data["schema_version"], "1.6")', 1)
          anchor = '        self.assertIn("agent and capsule authors", ledger["access_control"])\n'
          if body.count(anchor) != 1:
              raise SystemExit('schema test anchor drifted')
          body = body.replace(
              anchor,
              anchor +
              '        prohibited = data["prohibited_repository_contract"]\n'
              '        self.assertEqual(prohibited["project_far_repository_provider_id"], 1283452680)\n'
              '        self.assertTrue(prohibited["reject_exact_project_far_repository"])\n'
              '        self.assertTrue(prohibited["reject_github_fork_source_project_far"])\n'
              '        self.assertTrue(prohibited["require_project_far_treatment_material_absent"])\n'
              '        self.assertIn("github_fork_source_repository_id", ledger["record_required_keys_exactly"])\n'
              '        self.assertIn("contains_project_far_treatment_material", ledger["record_required_keys_exactly"])\n',
              1,
          )
          method_anchor = '    def test_semantic_weakening_fails_without_repinning_verifier(self) -> None:\n'
          if body.count(method_anchor) != 1:
              raise SystemExit('test method insertion anchor drifted')
          new_method = '''    def test_sealed_identity_ledger_rejects_project_far_repository_forks_treatment_and_url_aliases(self) -> None:\n        module = load_module("single_source_review_closure_prohibitions", DIR / "verify_review_closure.py")\n        manifest, ledger = build_manifest_and_ledger()\n        with tempfile.TemporaryDirectory() as tmp:\n            manifest_path = Path(tmp) / "manifest.json"\n            ledger_path = Path(tmp) / "ledger.json"\n\n            def write(current_manifest: list[dict], current_ledger: list[dict]) -> None:\n                manifest_path.write_text(json.dumps(current_manifest, indent=2) + "\\n", encoding="utf-8")\n                ledger_path.write_text(json.dumps(current_ledger, indent=2) + "\\n", encoding="utf-8")\n\n            def bind_root(current_manifest: list[dict], current_ledger: list[dict], index: int) -> None:\n                current_ledger[index]["task_bundle_root_sha256"] = hashlib.sha256(canonical_descriptor_bytes(current_ledger[index])).hexdigest()\n                current_manifest[index]["task_bundle_root_sha256"] = current_ledger[index]["task_bundle_root_sha256"]\n\n            cases: list[tuple[list[dict], list[dict]]] = []\n\n            exact_manifest = json.loads(json.dumps(manifest)); exact_ledger = json.loads(json.dumps(ledger))\n            exact_ledger[0]["repository_provider_id"] = 1283452680\n            bind_root(exact_manifest, exact_ledger, 0)\n            cases.append((exact_manifest, exact_ledger))\n\n            fork_manifest = json.loads(json.dumps(manifest)); fork_ledger = json.loads(json.dumps(ledger))\n            fork_ledger[0]["github_fork_source_repository_id"] = 1283452680\n            cases.append((fork_manifest, fork_ledger))\n\n            treatment_manifest = json.loads(json.dumps(manifest)); treatment_ledger = json.loads(json.dumps(ledger))\n            treatment_ledger[0]["contains_project_far_treatment_material"] = True\n            cases.append((treatment_manifest, treatment_ledger))\n\n            alias_manifest = json.loads(json.dumps(manifest)); alias_ledger = json.loads(json.dumps(ledger))\n            alias_ledger[1]["canonical_repository_url"] = alias_ledger[0]["canonical_repository_url"]\n            bind_root(alias_manifest, alias_ledger, 1)\n            cases.append((alias_manifest, alias_ledger))\n\n            for current_manifest, current_ledger in cases:\n                write(current_manifest, current_ledger)\n                with self.assertRaises(module.DesignError):\n                    module.validate_instantiated_identity_ledger(manifest_path, ledger_path)\n\n'''
          body = body.replace(method_anchor, new_method + method_anchor, 1)

          mutation_anchor = '            lambda d: d["order_contract"].__setitem__("runtime_sorting_permitted", True),\n'
          if body.count(mutation_anchor) != 1:
              raise SystemExit('semantic mutation anchor drifted')
          body = body.replace(
              mutation_anchor,
              mutation_anchor +
              '            lambda d: d["prohibited_repository_contract"].__setitem__("project_far_repository_provider_id", 1),\n'
              '            lambda d: d["prohibited_repository_contract"].__setitem__("require_project_far_treatment_material_absent", False),\n',
              1,
          )
          tests.write_text(body, encoding='utf-8', newline='\n')
          PY
      - name: Create local repair commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/pr438-root-closure.yml
          git add research/external-validation/swe-agent-v3/verify_review_closure.py tests/test_swe_agent_v3_single_source_integrity.py
          git commit -m "Close SWE v3 schema 1.6 validation gap"
      - name: Run exact-head targeted validation
        run: |
          python research/external-validation/swe-agent-v3/verify_review_closure.py
          python -m unittest tests.test_swe_agent_v3_single_source_integrity
          python tools/check_repository_hygiene.py
      - name: Run canonical fast suite
        run: python tools/run_tests.py --fast
      - name: Push validated repair
        run: git push origin HEAD:repair/pr435-final-contract-closure
