name: PR438 validated root closure v4

on:
  push:
    branches: [repair/pr435-final-contract-closure]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: repair/pr435-final-contract-closure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - name: Reapply semantic validator reconciliations
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          def execute(workflow, step_name):
              wf = yaml.safe_load(Path(workflow).read_text(encoding='utf-8'))
              step = next(s for s in wf['jobs']['repair']['steps'] if s.get('name') == step_name)
              run = step['run']; prefix = "python - <<'PY'\n"
              if not run.startswith(prefix) or not run.rstrip().endswith('\nPY'):
                  raise SystemExit(f'cannot extract {workflow}: {step_name}')
              subprocess.run(['python','-c',run[len(prefix):run.rfind('\nPY')]], check=True)
          execute('.github/workflows/pr438-root-closure.yml', 'Reconcile schema 1.6 verifier and tests')
          execute('.github/workflows/pr438-root-closure-v2.yml', 'Reconcile standalone schema 1.3 failure/arithmetic authority')
          execute('.github/workflows/pr438-root-closure-v3.yml', 'Reconcile execution gate schema 1.5')
          PY
      - name: Rebuild non-self-referential design integrity manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          manifest_path = root / 'research/external-validation/swe-agent-v3/design-manifest-v1.0.json'
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          required = [entry['path'] for entry in data['artifacts']]
          rebuilt = []
          for rel in required:
              raw = (root / rel).read_bytes()
              blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              rebuilt.append({'path': rel, 'git_blob_sha1': blob, 'bytes': len(raw)})
          data['artifacts'] = rebuilt
          manifest_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Delete temporary closure machinery
        run: |
          git rm -f \
            .github/workflows/pr438-root-closure.yml \
            .github/workflows/pr438-root-closure-diagnostic.yml \
            .github/workflows/pr438-root-closure-v2.yml \
            .github/workflows/pr438-root-closure-v3.yml \
            .github/workflows/pr438-root-closure-v4.yml
      - name: Commit local candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/external-validation/swe-agent-v3/design-manifest-v1.0.json \
                  research/external-validation/swe-agent-v3/verify_review_closure.py \
                  research/external-validation/swe-agent-v3/verify_amendment_v1_1.py \
                  tests/test_swe_agent_v3_single_source_integrity.py \
                  tests/test_swe_agent_v3_amendment_v1_1.py
          git commit -m "Reconcile SWE v3 validators and integrity root"
      - name: Governing verifiers
        run: |
          python research/external-validation/swe-agent-v3/verify_amendment_v1_1.py
          python research/external-validation/swe-agent-v3/verify_review_closure.py
          python research/external-validation/swe-agent-v3/verify_design.py
          python research/external-validation/swe-agent-v3/verify_integrity.py
          python research/external-validation/swe-agent-v3/verify_public_narratives.py
          python research/external-validation/swe-agent-v3/verify_public_narratives_v2.py
      - name: Complete SWE v3 tests
        run: python -m unittest discover -s tests -p 'test_swe_agent_v3*.py' -v
      - name: Repository hygiene
        run: python tools/check_repository_hygiene.py
      - name: Canonical fast suite
        run: python tools/run_tests.py --fast
      - name: Push validated candidate only
        run: git push origin HEAD:repair/pr435-final-contract-closure
