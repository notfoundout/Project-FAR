name: PR435 finish path-only test migration

on:
  push:
    branches:
      - repair/pr435-final-contract-closure

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: repair/pr435-final-contract-closure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Finish schema-1.4 migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          pkg = root / 'research/external-validation/swe-agent-v3'
          tests = root / 'tests'

          # Normalize the two known fixture helpers if the first migration did not already do so.
          p = tests / 'test_swe_agent_v3_design.py'
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'    def refresh_manifest\(self, commit: bool = True\) -> None:\n.*?(?=    def mutate_json\()',
              '    def refresh_manifest(self, commit: bool = True) -> None:\n'
              '        # A semantic mutation is the newly committed fixture tree; the path registry is unchanged.\n'
              '        if commit:\n'
              '            self.sync_committed()\n\n',
              text, count=1, flags=re.S,
          )
          # Eliminate obsolete direct mutation of a manifest bytes field if it survived.
          text = text.replace('data["artifacts"][0]["bytes"] += 1', 'data["artifacts"][0]["unexpected_current_byte_metadata"] = 1')
          p.write_text(text, encoding='utf-8', newline='\n')

          p = tests / 'test_swe_agent_v3_contract_locks.py'
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'    def refresh_manifest_and_commit_fixture\(self\) -> None:\n.*?(?=    def mutate_json\()',
              '    def refresh_manifest_and_commit_fixture(self) -> None:\n'
              '        # Commit the changed governed artifact; semantic rejection must not depend on repinning.\n'
              '        self.sync_committed()\n\n',
              text, count=1, flags=re.S,
          )
          p.write_text(text, encoding='utf-8', newline='\n')

          # Replace manifest-specific legacy tests that fundamentally assert embedded current identities.
          canonical = '''from __future__ import annotations

import importlib.util
import json
import sys
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
DIR = ROOT / "research/external-validation/swe-agent-v3"
PATH = DIR / "verify_integrity.py"
SPEC = importlib.util.spec_from_file_location("swe_v3_manifest_integrity", PATH)
assert SPEC and SPEC.loader
module = importlib.util.module_from_spec(SPEC)
sys.modules[SPEC.name] = module
SPEC.loader.exec_module(module)


class SweAgentV3ManifestAuthorityTests(unittest.TestCase):
    def test_manifest_is_path_only_registry(self) -> None:
        manifest = json.loads((DIR / "design-manifest-v1.0.json").read_text(encoding="utf-8"))
        self.assertEqual(manifest["schema_version"], "1.4")
        self.assertEqual(manifest["program_id"], "FAR-SWE-V3-001")
        self.assertEqual(manifest["artifact_status"], "Research")
        self.assertIn("governed-path registry", manifest["scope"])
        self.assertIn("not redundantly repinned", manifest["scope"])
        self.assertTrue(manifest["artifacts"])
        for entry in manifest["artifacts"]:
            self.assertEqual(set(entry), {"path"})
        self.assertEqual({entry["path"] for entry in manifest["artifacts"]}, module.REQUIRED_ARTIFACTS)

    def test_current_identity_is_git_head_not_manifest_metadata(self) -> None:
        source = PATH.read_text(encoding="utf-8")
        self.assertIn("HEAD:{relative}", source)
        self.assertNotIn("EXPECTED_MANIFEST_GIT_BLOB_SHA1", source)
        manifest_text = (DIR / "design-manifest-v1.0.json").read_text(encoding="utf-8")
        self.assertNotIn("git_blob_sha1", manifest_text)
        self.assertNotIn('"bytes"', manifest_text)
        self.assertNotIn('"sha256"', manifest_text)

    def test_canonical_manifest_and_semantics_verify(self) -> None:
        module.verify_manifest()
        module.verify_byte_policy()


if __name__ == "__main__":
    unittest.main()
'''
          replaced = []
          for path in sorted(tests.glob('test_swe_agent_v3*manifest*.py')):
              body = path.read_text(encoding='utf-8')
              if 'git_blob_sha1' in body or '["bytes"]' in body or "['bytes']" in body or 'EXPECTED_MANIFEST_GIT_BLOB_SHA1' in body:
                  path.write_text(canonical, encoding='utf-8', newline='\n')
                  replaced.append(path.name)

          # Canonical current public narrative oracle from the reviewed surfaces.
          narrative_names = ['question-v1.0.md', 'AMENDMENT-v1.1.md', 'README.md', 'evidence-and-analysis-plan-v1.0.md']
          expected = {name: (pkg / name).read_text(encoding='utf-8') for name in narrative_names}
          oracle = pkg / 'verify_public_narratives.py'
          lines = [
              '"""Whole-document semantic oracles for public FAR-SWE-V3-001 narratives."""',
              'from __future__ import annotations', '', 'from pathlib import Path', '',
              'HERE = Path(__file__).resolve().parent', '',
              'class NarrativeError(ValueError):', '    pass', '', 'EXPECTED = {',
          ]
          for name in narrative_names:
              lines.append(f'    {name!r}: {expected[name]!r},')
          lines += [
              '}', '',
              'def verify(here: Path = HERE) -> None:',
              '    for name, expected in EXPECTED.items():',
              '        path = here / name',
              '        if path.is_symlink() or not path.is_file():',
              '            raise NarrativeError(f"regular public narrative required: {name}")',
              '        actual = path.read_text(encoding="utf-8")',
              '        if actual != expected:',
              '            raise NarrativeError(f"complete public narrative contract drifted: {name}")',
              '',
              'if __name__ == "__main__":',
              '    try:', '        verify()',
              '    except NarrativeError as exc:', '        raise SystemExit(f"FAIL: {exc}")',
              '    print("PASS: complete public narrative contracts verified.")', '',
          ]
          oracle.write_text('\n'.join(lines), encoding='utf-8', newline='\n')
          for obsolete in ('verify_public_narratives_v2.py', 'verify_public_narratives_v3.py'):
              q = pkg / obsolete
              if q.exists():
                  q.unlink()
          integrity = pkg / 'verify_integrity.py'
          body = integrity.read_text(encoding='utf-8')
          body = body.replace('import verify_public_narratives_v2 as public_narratives', 'import verify_public_narratives as public_narratives')
          body = body.replace('import verify_public_narratives_v3 as public_narratives', 'import verify_public_narratives as public_narratives')
          integrity.write_text(body, encoding='utf-8', newline='\n')

          # Public README wording must match path-only authority.
          readme = pkg / 'README.md'
          body = readme.read_text(encoding='utf-8')
          body = body.replace(
              'The reviewed Git commit/tree is the immutable current root. Every governed current design artifact plus archival context is indexed exactly once by `design-manifest-v1.0.json`. The manifest records committed Git blob identity and byte count; semantic verifiers enforce complete type-exact contract invariants without copying mutable current blob IDs into verifier constants. Verifier source is deliberately excluded from the governed-artifact manifest to avoid recursive self-hashing and remains ordinary reviewed code at the exact PR head.',
              'The reviewed Git commit/tree is the immutable current-byte root. `design-manifest-v1.0.json` is only the exact governed-path registry; it deliberately contains no current blob IDs, byte counts, hashes, or semantic digests. For every governed path, verification reads the exact blob from `HEAD:path` and requires the checkout bytes to match it. Semantic verifiers and complete public-narrative oracles enforce meaning independently, so a legitimate contract edit changes one Git tree rather than triggering redundant current-identity repins. Verifier source is deliberately outside the governed-path registry to avoid recursive self-reference and remains ordinary reviewed code at the exact PR head.'
          )
          readme.write_text(body, encoding='utf-8', newline='\n')

          # Rebuild oracle once more after README normalization.
          expected = {name: (pkg / name).read_text(encoding='utf-8') for name in narrative_names}
          lines = [
              '"""Whole-document semantic oracles for public FAR-SWE-V3-001 narratives."""',
              'from __future__ import annotations', '', 'from pathlib import Path', '',
              'HERE = Path(__file__).resolve().parent', '',
              'class NarrativeError(ValueError):', '    pass', '', 'EXPECTED = {',
          ]
          for name in narrative_names:
              lines.append(f'    {name!r}: {expected[name]!r},')
          lines += [
              '}', '', 'def verify(here: Path = HERE) -> None:',
              '    for name, expected in EXPECTED.items():',
              '        path = here / name',
              '        if path.is_symlink() or not path.is_file():',
              '            raise NarrativeError(f"regular public narrative required: {name}")',
              '        actual = path.read_text(encoding="utf-8")',
              '        if actual != expected:',
              '            raise NarrativeError(f"complete public narrative contract drifted: {name}")',
              '', 'if __name__ == "__main__":', '    try:', '        verify()',
              '    except NarrativeError as exc:', '        raise SystemExit(f"FAIL: {exc}")',
              '    print("PASS: complete public narrative contracts verified.")', '',
          ]
          oracle.write_text('\n'.join(lines), encoding='utf-8', newline='\n')

          # Ensure syntax before committing.
          import py_compile
          for path in list(pkg.glob('verify*.py')) + list(tests.glob('test_swe_agent_v3*.py')):
              py_compile.compile(str(path), doraise=True)
          PY
      - name: Commit migration and remove temporary workflows
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/pr435-finalize-path-only.yml 2>/dev/null || true
          git rm -f .github/workflows/pr435-finalize-path-only-2.yml
          git add research/external-validation/swe-agent-v3 tests
          git commit -m "Finish SWE v3 path-only manifest migration"
          git push origin HEAD:repair/pr435-final-contract-closure
