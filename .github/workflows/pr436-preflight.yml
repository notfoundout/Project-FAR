name: PR436 final preflight

on:
  push:
    branches:
      - repair/pr436-final-zero-review

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/pr436-final-zero-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Remove preflight workflow from candidate
        run: rm -f .github/workflows/pr436-preflight.yml
      - name: Create exact local candidate commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Certify PR436 final exploratory verifier tree"
          git rev-parse HEAD
      - name: Target-category governing verifier
        run: python research/target-category-discovery/verify_compositional_invariant.py
      - name: Target-category regression suite
        run: python -m unittest tests.test_target_category_compositional_invariant -v
      - name: Repository hygiene
        run: python tools/check_repository_hygiene.py
      - name: Canonical fast suite
        shell: bash
        run: |
          set -o pipefail
          python tools/run_tests.py --fast 2>&1 | tee /tmp/fast-suite.log
      - name: Push exact validated candidate
        run: git push origin HEAD:repair/pr436-final-zero-review
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr436-preflight-diagnostics
          path: /tmp/fast-suite.log
          if-no-files-found: ignore
