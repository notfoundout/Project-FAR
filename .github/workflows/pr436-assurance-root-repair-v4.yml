name: PR436 Assurance Root Repair V4

on:
  push:
    branches:
      - agent/close-structured-reasoning-compositional-question

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated V3 transformation and correct regression oracle
        shell: bash
        run: |
          set -euo pipefail
          awk 'BEGIN{flag=0} /^          python - <<'\''PY'\''$/{flag=1;next} /^          PY$/{if(flag){flag=0;exit}} flag{sub(/^          /,""); print}' .github/workflows/pr436-assurance-root-repair-v3.yml > /tmp/pr436_repair.py
          test -s /tmp/pr436_repair.py
          python /tmp/pr436_repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_target_category_validator_assurance_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = 'self.assertTrue(any("protected validator binding changed" in item for item in finding.failures))'
          new = 'self.assertTrue(any(("protected validator binding changed" in item) or ("definition-time decorator rejected" in item) for item in finding.failures))'
          if text.count(old) != 1:
              raise SystemExit(f'expected one regression assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          for rel in (
              '.github/workflows/pr436-assurance-root-repair.yml',
              '.github/workflows/pr436-assurance-root-repair-v2.yml',
              '.github/workflows/pr436-assurance-root-repair-v3.yml',
              '.github/workflows/pr436-assurance-root-repair-v4.yml',
          ):
              p = Path(rel)
              if p.exists():
                  p.unlink()
          PY

      - name: Run focused validation
        run: |
          set -euo pipefail
          python -m unittest tests.test_target_category_compositional_invariant -v
          python -m unittest tests.test_target_category_validator_assurance_hardening -v
          python -m far_validation weakening

      - name: Run complete PR-fast validation
        run: python -m far_validation run --profile pr-fast --trace-mode required

      - name: Commit and push validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden protected validator assurance at root'
          git push
