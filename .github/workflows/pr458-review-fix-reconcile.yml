name: PR458 Review Fix Reconcile

on:
  push:
    branches:
      - research/post-w1-infrastructure-w2-formalization

permissions:
  contents: write

jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[pr458-reconciled]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema
      - name: Normalize checker and migration script
        run: |
          python - <<'PY'
          from pathlib import Path

          checker = Path('tools/check_far_core_v11_formalization.py')
          text = checker.read_text(encoding='utf-8')
          target = '    "FARCoreV11.finite_panel_two_completions": frozenset(),\n'
          inserted = '    "FARCoreV11.finite_operator_count_noninvariant": frozenset({"Quot.sound"}),\n' + target
          if '"FARCoreV11.finite_operator_count_noninvariant"' not in text:
              if target not in text:
                  raise SystemExit('finite-panel axiom anchor missing')
              checker.write_text(text.replace(target, inserted, 1), encoding='utf-8')

          migration = Path('tools/_tmp_pr458_review_fix.py')
          source = migration.read_text(encoding='utf-8')
          start_marker = '# Formalization checker: make the new declaration mandatory in the exact axiom contract.\n'
          end_marker = '# W1: an independent hard-coded seal prevents coordinated artifact+promotion hash rewrites.\n'
          if start_marker in source:
              start = source.index(start_marker)
              end = source.index(end_marker)
              source = source[:start] + '# Formalization checker normalized by workflow before migration.\n\n' + source[end:]
              migration.write_text(source, encoding='utf-8')
          PY
      - name: Apply review repairs
        run: python tools/_tmp_pr458_review_fix.py
      - name: Regenerate axiom audit source directly
        run: |
          python - <<'PY'
          from tools import check_far_core_v11_formalization as checker
          checker.AXIOM_AUDIT_PATH.write_text(checker.render_axiom_audit(), encoding='utf-8')
          PY
      - name: Regenerate formalization views
        run: python tools/check_far_core_v11_formalization.py --write
      - name: Regenerate research/assurance graph views
        run: python tools/far_research_registry.py --write
      - name: Run targeted Python regressions
        run: |
          python -m unittest tests.test_far_core_v11_formalization
          python -m unittest tests.test_far_research_infrastructure
      - name: Commit deterministic repair
        run: |
          if git diff --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mechanization/lean/FARCoreV11Claims001To012.lean \
                  mechanization/lean/FARCoreV11AxiomAudit.lean \
                  theory/evaluation/far-core-formalization-ledger-v1.0.json \
                  theory/evaluation/far-core-assurance-v1.0.json \
                  tools/check_far_core_v11_formalization.py \
                  tools/far_research_registry.py \
                  tests/test_far_core_v11_formalization.py \
                  tests/test_far_research_infrastructure.py \
                  docs/governance/pca-w1-independent-review-promotion-v1.0.md \
                  artifacts/mechanization/lean-inventory-v1.0.json \
                  docs/mechanization/far-core-v1.1-formalization.md \
                  docs/assurance/far-core-assurance.md \
                  artifacts/knowledge-graph/project-far-knowledge-graph.json
          git commit -m 'Fix final W1 seal and FAR-CORE-008 review gaps [pr458-reconciled]'
          git push origin HEAD:research/post-w1-infrastructure-w2-formalization
