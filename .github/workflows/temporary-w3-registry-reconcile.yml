name: Temporary W3 Registry Reconciliation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'research/pca-w3-contract-schema'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pca-w3-contract-schema
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate canonical research views
        run: |
          python tools/far_research_registry.py --write
          python tools/far_research_registry.py
      - name: Remove temporary workflow and commit deterministic outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-w3-registry-reconcile.yml
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile W3 generated research registry outputs'
          git push origin HEAD:research/pca-w3-contract-schema
