name: Living Research Watch

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run discovery, validate the current ref, or audit every run report
        required: true
        default: discover
        type: choice
        options:
          - discover
          - validate
          - audit
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/living-research.yml'
      - 'tools/run_living_research.py'
      - 'tools/reconcile_living_repo.py'
      - 'tools/check_living_research.py'
      - 'tests/test_living_research.py'
      - 'tests/test_living_research_workflow.py'
      - 'research/living/**'
      - 'research/registry/research-questions-v1.0.json'
      - 'research/registry/epistemic-threats-v1.0.json'
      - 'research/registry/opportunities-v1.0.json'
      - 'research/registry/citation-links-v1.0.json'
      - 'theory/terminal/project-far-core-theory-v1.1.json'
      - 'theory/evaluation/far-core-assurance-v1.0.json'
      - 'docs/project-status.md'
      - 'docs/CANONICAL_MAP.md'
      - 'docs/governance/**'
      - 'docs/research/living-research-status.md'
      - 'docs/research/living-repository-status.md'
      - 'docs/research/living-repository.md'

concurrency:
  group: living-research-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (inputs.mode == 'validate' || inputs.mode == 'audit') && 'validator' || 'writer' }}
  cancel-in-progress: false

env:
  LIVING_RESEARCH_BRANCH: automation/living-research-inbox

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'validate' || inputs.mode == 'audit'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical repository dependencies
        run: pip install -r requirements.txt
      - name: Unit-test living repository
        run: python -m unittest tests.test_living_research tests.test_living_research_workflow -v
      - name: Reconcile canonical living-repository state
        run: python tools/reconcile_living_repo.py
      - name: Validate living repository invariants
        # Bounded on every automatic path. This job is dispatched by `discover` after each
        # unattended update, so a full historical scan here would put unbounded and steadily
        # growing work on the highest-frequency validation path. `audit` mode is the
        # explicit full scan.
        run: python tools/check_living_research.py ${{ inputs.mode == 'audit' && '--all-runs' || '' }}
      - name: Validate governed research gates
        run: python tools/check_research_gates.py
      - name: Run repository fast health profile
        run: python tools/repo_health_check.py --fast

  discover:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'discover')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical repository dependencies
        run: pip install -r requirements.txt
      - name: Prepare persistent research inbox branch
        id: inbox
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$LIVING_RESEARCH_BRANCH"
          git config user.name "project-far-research-bot"
          git config user.email "project-far-research-bot@users.noreply.github.com"
          git fetch origin main
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"

          # The working tree is always built from protected `main`, so every tool and
          # configuration file executed below is reviewed, merge-authority-gated code.
          # Only accumulated *data* is carried over from the inbox branch. Checking the
          # inbox branch out and running it would let anyone able to push to that
          # unprotected branch execute code under a write-scoped token on a schedule.
          git switch -C "$branch" origin/main
          branch_exists=false
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch_exists=true
            git fetch origin "$branch"
            # Carried over whatever the PR state is: closing a stale rolling PR must not
            # silently discard the accumulated inbox. Already-merged data restores to the
            # identical content main now holds, so this is a no-op in that case.
            for path in research/living/inbox research/living/runs \
                        research/living/state-v1.0.json \
                        research/living/repository-state-v1.0.json; do
              if git cat-file -e "origin/$branch:$path" 2>/dev/null; then
                git checkout "origin/$branch" -- "$path"
              fi
            done
          fi
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"
      - name: Preflight tests and authority checks
        run: |
          python -m unittest tests.test_living_research tests.test_living_research_workflow -v
          python tools/reconcile_living_repo.py
          python tools/check_living_research.py
          python tools/check_research_gates.py
      - name: Discover current and historical research
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python tools/run_living_research.py
      - name: Reconcile dependency, claim, and project state
        run: python tools/reconcile_living_repo.py
      - name: Validate generated living repository
        run: |
          python tools/check_living_research.py
          python -m unittest tests.test_living_research tests.test_living_research_workflow -v
          python tools/check_research_gates.py
          python tools/repo_health_check.py --fast
      - name: Commit and push inbox state
        id: push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add research/living \
            docs/research/living-research-status.md \
            docs/research/living-repository-status.md
          git commit -m "research: update unattended living repository"
          # The branch is rebuilt as exactly one commit on current main each run, so the
          # rolling PR stays a readable single-commit diff instead of accumulating a merge
          # commit per run, and it can never conflict with its own base.
          if [[ "${{ steps.inbox.outputs.branch_exists }}" == "true" ]]; then
            git push --force-with-lease="$LIVING_RESEARCH_BRANCH:$(git rev-parse "origin/$LIVING_RESEARCH_BRANCH")" \
              origin "HEAD:$LIVING_RESEARCH_BRANCH"
          else
            git push -u origin "HEAD:$LIVING_RESEARCH_BRANCH"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create or refresh rolling research PR
        id: rolling_pr
        if: steps.push.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR: ${{ steps.inbox.outputs.open_pr }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/living-research-pr.md <<'EOF'
          ## Summary

          Rolling unattended **Research-only** living-repository inbox produced by
          `FAR-LIVING-RESEARCH-001` / `FAR-LIVING-REPOSITORY-001`.

          The branch records incremental and historical discovery, deterministic
          acceptance/rejection reasons, cross-provider identities, source failures,
          canonical-surface reconciliation, claim dependency impact, and metadata-only
          core-claim review queues. It is intentionally non-authoritative.

          ## Research Contribution and Claim Boundary

          - **Central claim tested:** none by discovery alone
          - **Evidential role:** discovery, historical backfill, triage, and reconciliation
          - **Current uncertainty reduced:** none until candidates pass governed review
          - **Result that could count against FAR:** only a later exact reproducible contradiction under canonical premises
          - **Frozen theory:** current governed main theory; living state never silently rewrites it
          - **Independence:** none claimed; Project-FAR-authored automation
          - **Strongest claim supported:** listed source metadata matched the declared routing rules and canonical surfaces reconciled mechanically
          - **Explicit nonclaims:** no theorem, novelty, priority, external-validity, utility, independence, EFR, OP-28, W1-W6, or commercial-status change

          ## Historical and philosophical scope

          Backfill walks publication windows to 1600 using Crossref and OpenAlex, plus
          low-volume Open Library book discovery. Philosophy/metaphysics lanes require
          an explicit formal or mathematical bridge.

          ## Validation

          Every unattended update runs unit tests, deterministic reconciliation,
          living-repository invariants, governed research gates, and repository fast health.

          ## Check status: this PR starts with no checks, by construction

          This branch is pushed and this PR is opened by `GITHUB_TOKEN`. GitHub does not
          start workflow runs from events caused by `GITHUB_TOKEN`, so **no required check
          reports here on its own** — including protected `merge-authority`. The PR is not
          mergeable until a human takes one action:

          - close and reopen this PR, or
          - push any commit to the branch under a human identity.

          Either one makes the normal required checks run. The automation deliberately does
          not work around this: posting a commit status from the workflow would forge the
          merge-authority signal rather than satisfy it, and reintroducing a privileged
          token was retired in `docs/governance/privileged-token-retirement-2026-09-05.md`.

          Independent of this PR, each unattended update dispatches a validation run of this
          workflow against the branch head, so the content is checked even while the PR has
          no check of its own. That run is not a PR status check and does not satisfy branch
          protection.

          This PR is deliberately not auto-merged. Protected `main` remains the sole canonical state.
          EOF
          if [[ -n "$OPEN_PR" ]]; then
            gh pr edit "$OPEN_PR" --repo "$GITHUB_REPOSITORY" --title "Research: rolling living-repository inbox" --body-file /tmp/living-research-pr.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$LIVING_RESEARCH_BRANCH" --title "Research: rolling living-repository inbox" --body-file /tmp/living-research-pr.md
          fi
      - name: Maintain core-claim review queue issue
        id: review_queue
        if: always() && steps.push.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/claim-review.md
          import json
          from pathlib import Path

          data = json.loads(Path("research/living/repository-state-v1.0.json").read_text())
          queue = data.get("core_claim_review_queue", [])
          print("## Living repository core-claim review queue")
          print()
          print("**Research metadata signals only. Nothing here is a contradiction or claim-status change.**")
          print()
          if not queue:
              print("No current high-attention candidates are mapped to FAR-CORE claims.")
          for item in queue[:50]:
              claims = ", ".join(item.get("claim_ids", []))
              fallout = ", ".join(item.get("downstream_claim_ids", [])) or "none"
              terms = ", ".join(item.get("attention_terms", []))
              print(f"- `{item.get('candidate_id')}` → {claims}; terms: {terms}; downstream claim fallout if independently substantiated: {fallout}")
          print()
          print("Required path: verify primary source → reconstruct exact premises/conclusion → attack → replicate → adjudicate → smallest governed correction if warranted.")
          PY
          count="$(python -c 'import json; print(len(json.load(open("research/living/repository-state-v1.0.json"))["core_claim_review_queue"]))')"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Living repository: core-claim review queue" in:title' --json number --jq '.[0].number // empty')"
          if [[ "$count" -gt 0 ]]; then
            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claim-review.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Living repository: core-claim review queue" --body-file /tmp/claim-review.md
            fi
          elif [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Living repository reconciliation currently has no metadata-only core-claim review candidates."
          fi
      - name: Dispatch explicit validation for automated head
        id: validation_dispatch
        if: always() && steps.push.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run living-research.yml --repo "$GITHUB_REPOSITORY" --ref "$LIVING_RESEARCH_BRANCH" -f mode=validate
      - name: Fail if required post-push governance surfaces failed
        if: always() && steps.push.outputs.changed == 'true'
        env:
          ROLLING_PR_OUTCOME: ${{ steps.rolling_pr.outcome }}
          REVIEW_QUEUE_OUTCOME: ${{ steps.review_queue.outcome }}
          VALIDATION_DISPATCH_OUTCOME: ${{ steps.validation_dispatch.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          check_outcome() {
            local surface="$1"
            local outcome="$2"
            if [[ "$outcome" != "success" ]]; then
              echo "::error title=Living repository governance surface failed::$surface outcome=$outcome"
              failures=1
            fi
          }
          check_outcome "rolling research PR" "$ROLLING_PR_OUTCOME"
          check_outcome "core-claim review queue" "$REVIEW_QUEUE_OUTCOME"
          check_outcome "explicit validation dispatch" "$VALIDATION_DISPATCH_OUTCOME"
          if [[ "$failures" -ne 0 ]]; then
            echo "::error title=Living repository post-push failure::Research data was preserved on $LIVING_RESEARCH_BRANCH, but one or more required governance or validation surfaces failed after the push."
            exit 1
          fi
