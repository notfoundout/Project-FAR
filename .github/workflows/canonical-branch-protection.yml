name: Canonical Branch Protection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    if: github.repository == 'notfoundout/Project-FAR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require admin token
        env:
          FAR_GITHUB_ADMIN_TOKEN: ${{ secrets.FAR_GITHUB_ADMIN_TOKEN }}
        run: |
          if [ -z "${FAR_GITHUB_ADMIN_TOKEN}" ]; then
            echo "::error::FAR_GITHUB_ADMIN_TOKEN is not configured"
            exit 1
          fi
      - name: Configure strict main protection
        env:
          FAR_GITHUB_ADMIN_TOKEN: ${{ secrets.FAR_GITHUB_ADMIN_TOKEN }}
        run: python tools/configure_validation_protection.py --repository "${{ github.repository }}" --branch main
      - name: Read back canonical protection
        env:
          FAR_GITHUB_ADMIN_TOKEN: ${{ secrets.FAR_GITHUB_ADMIN_TOKEN }}
        run: python tools/check_validation_protection.py --repository "${{ github.repository }}" --branch main
