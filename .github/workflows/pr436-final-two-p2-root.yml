name: PR436 final two-P2 root closure

on:
  push:
    branches:
      - repair/pr436-final-two-p2-root

permissions:
  contents: write

jobs:
  fix-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/pr436-final-two-p2-root
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Eliminate legacy constant duplication and require live verify prefixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          legacy = Path('research/target-category-discovery/verify_compositional_invariant_legacy.py')
          s = legacy.read_text(encoding='utf-8')
          replacements = [
              ('EXPECTED_SPEC_SHA256 = "9570d1b9f8653269e8ca2a32a84f676ed2c72add192987c9d77c1a6ab52043b4"', 'EXPECTED_SPEC_SHA256 = "2b6ede05f7d5e3525070e1a5893ea599613a64eb114b12ed43606fb114e14128"'),
              ('    "Report": "40f44473b86c174157ed8a8b583ef10b0a50a58b7fe80d8d372bf004ca1fc13b",', '    "Report": "426b48e0b1a8724bd718bb3ffb5491f2f97b79860c90f4d1f57c35d78434c991",'),
              ('    "version": "1.2",', '    "version": "1.0",'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'legacy constant anchor count={s.count(old)} for {old[:40]}')
              s = s.replace(old, new, 1)
          old_verify = '''def verify(spec_path: Path = DEFAULT_SPEC, result_path: Path = DEFAULT_RESULT, report_path: Path = DEFAULT_REPORT, readme_path: Path = DEFAULT_README, charter_path: Path = DEFAULT_CHARTER, gates_path: Path = DEFAULT_GATES, empirical_charter_path: Path = DEFAULT_EMPIRICAL_CHARTER, empirical_manifest_path: Path = DEFAULT_EMPIRICAL_MANIFEST, audit_path: Path = DEFAULT_CHAT_AUDIT) -> dict[str, Any]:\n    actual = build_result(load_json(spec_path))\n    if actual != load_json(result_path): raise VerificationError("committed result does not match a fresh rebuild")\n    validate_public_surface("README", readme_path); validate_public_surface("Charter", charter_path); validate_public_surface("Report", report_path)\n    validate_empirical_authority(empirical_charter_path, empirical_manifest_path, audit_path)\n    validate_gate(gates_path)\n    if actual["classification"] != "exploratory_unregistered_derivation": raise VerificationError("classification must remain exploratory")\n    if actual["release_status"] != "not_eligible_unregistered_deductive_program": raise VerificationError("unregistered derivation cannot be release-eligible")\n    return actual\n'''
          new_verify = '''def verify(spec_path: Path = DEFAULT_SPEC, result_path: Path = DEFAULT_RESULT, report_path: Path = DEFAULT_REPORT, readme_path: Path = DEFAULT_README, charter_path: Path = DEFAULT_CHARTER, gates_path: Path = DEFAULT_GATES, empirical_charter_path: Path = DEFAULT_EMPIRICAL_CHARTER, empirical_manifest_path: Path = DEFAULT_EMPIRICAL_MANIFEST, audit_path: Path = DEFAULT_CHAT_AUDIT) -> dict[str, Any]:\n    validate_empirical_authority(empirical_charter_path, empirical_manifest_path, audit_path)\n    validate_gate(gates_path)\n    actual = build_result(load_json(spec_path))\n    if actual != load_json(result_path): raise VerificationError("committed result does not match a fresh rebuild")\n    validate_public_surface("README", readme_path); validate_public_surface("Charter", charter_path); validate_public_surface("Report", report_path)\n    if actual["classification"] != "exploratory_unregistered_derivation": raise VerificationError("classification must remain exploratory")\n    if actual["release_status"] != "not_eligible_unregistered_deductive_program": raise VerificationError("unregistered derivation cannot be release-eligible")\n    return actual\n'''
          if s.count(old_verify) != 1:
              raise SystemExit(f'legacy verify block count={s.count(old_verify)}')
          legacy.write_text(s.replace(old_verify, new_verify, 1), encoding='utf-8', newline='\n')

          public = Path('research/target-category-discovery/verify_compositional_invariant.py')
          s = public.read_text(encoding='utf-8')
          for line in (
              '_core.EXPECTED_SPEC["version"] = "1.0"\n',
              '_core.EXPECTED_SPEC_SHA256 = "2b6ede05f7d5e3525070e1a5893ea599613a64eb114b12ed43606fb114e14128"\n',
              '_core.EXPECTED_PUBLIC_SHA256["Report"] = "426b48e0b1a8724bd718bb3ffb5491f2f97b79860c90f4d1f57c35d78434c991"\n',
          ):
              if s.count(line) != 1:
                  raise SystemExit(f'wrapper constant patch anchor count={s.count(line)}')
              s = s.replace(line, '', 1)
          old_body = '''    result = _original_verify(\n        spec_path,\n        result_path,\n        report_path,\n        readme_path,\n        charter_path,\n        gates_path,\n        empirical_charter_path,\n        empirical_manifest_path,\n        audit_path,\n    )\n    # Defense in depth: the public entrypoint itself requires both controlling\n    # empirical authority and the complete RG-07 release boundary.\n    validate_empirical_authority(empirical_charter_path, empirical_manifest_path, audit_path)\n    validate_gate(gates_path)\n    return result\n'''
          new_body = '''    # The first two executable statements are fail-closed authority gates.\n    # The weakening detector requires this exact unconditional live prefix.\n    validate_empirical_authority(empirical_charter_path, empirical_manifest_path, audit_path)\n    validate_gate(gates_path)\n    result = _original_verify(\n        spec_path,\n        result_path,\n        report_path,\n        readme_path,\n        charter_path,\n        gates_path,\n        empirical_charter_path,\n        empirical_manifest_path,\n        audit_path,\n    )\n    return result\n'''
          if s.count(old_body) != 1:
              raise SystemExit(f'public verify body count={s.count(old_body)}')
          public.write_text(s.replace(old_body, new_body, 1), encoding='utf-8', newline='\n')

          weak = Path('far_validation/weakening.py')
          s = weak.read_text(encoding='utf-8')
          old_map = '''REQUIRED_SEMANTIC_CALLS: dict[str, frozenset[str]] = {\n    "research/target-category-discovery/verify_compositional_invariant.py": frozenset({"validate_empirical_authority"}),\n    "research/target-category-discovery/verify_compositional_invariant_legacy.py": frozenset({"validate_empirical_authority"}),\n}\n'''
          new_map = '''REQUIRED_LIVE_CALL_PREFIXES: dict[str, tuple[str, ...]] = {\n    "research/target-category-discovery/verify_compositional_invariant.py": ("validate_empirical_authority", "validate_gate"),\n    "research/target-category-discovery/verify_compositional_invariant_legacy.py": ("validate_empirical_authority", "validate_gate"),\n}\nREQUIRED_SEMANTIC_CALLS: dict[str, frozenset[str]] = {\n    path: frozenset(prefix) for path, prefix in REQUIRED_LIVE_CALL_PREFIXES.items()\n}\n'''
          if s.count(old_map) != 1:
              raise SystemExit(f'weakening map count={s.count(old_map)}')
          s = s.replace(old_map, new_map, 1)
          start = s.index('def _live_direct_calls(')
          end = s.index('\ndef analyze(', start)
          helper = '''def _live_call_prefix(source: str, path: str, function_name: str = "verify", count: int = 2) -> tuple[str, ...]:\n    """Return the exact unconditional call prefix of the public verification path.\n\n    The protected verifiers must begin with fail-closed authority checks. Any\n    assignment, conditional, loop, try, return, raise, or other statement inserted\n    before those calls changes the prefix and is rejected, including conditionally\n    terminating branches such as ``if True: return``.\n    """\n    tree = ast.parse(source, filename=path)\n    matches = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == function_name]\n    if len(matches) != 1:\n        return ()\n    body = list(matches[0].body)\n    if body and isinstance(body[0], ast.Expr) and isinstance(body[0].value, ast.Constant) and isinstance(body[0].value.value, str):\n        body = body[1:]\n    names: list[str] = []\n    for statement in body[:count]:\n        if isinstance(statement, ast.Expr) and isinstance(statement.value, ast.Call):\n            names.append(_call_name(statement.value))\n        else:\n            names.append("")\n    return tuple(names)\n\n'''
          s = s[:start] + helper + s[end+1:]
          old_detect = '''            required_calls = REQUIRED_SEMANTIC_CALLS.get(path, frozenset())\n            if required_calls:\n                missing_calls = sorted(required_calls - _live_direct_calls(after_source, path))\n                if missing_calls:\n                    finding.failures.append("required semantic validator calls absent from live verify path: " + ", ".join(missing_calls))\n'''
          new_detect = '''            required_prefix = REQUIRED_LIVE_CALL_PREFIXES.get(path)\n            if required_prefix:\n                actual_prefix = _live_call_prefix(after_source, path, count=len(required_prefix))\n                if actual_prefix != required_prefix:\n                    finding.failures.append(\n                        "required live verify call prefix changed: expected "\n                        + " -> ".join(required_prefix)\n                        + "; got "\n                        + " -> ".join(name or "<non-call>" for name in actual_prefix)\n                    )\n'''
          if s.count(old_detect) != 1:
              raise SystemExit(f'weakening detection block count={s.count(old_detect)}')
          s = s.replace(old_detect, new_detect, 1)
          weak.write_text(s, encoding='utf-8', newline='\n')

          tests = Path('tests/test_target_category_compositional_invariant.py')
          s = tests.read_text(encoding='utf-8')
          old_expect = 'self.assertEqual(weakening.REQUIRED_SEMANTIC_CALLS[protected], frozenset({"validate_empirical_authority"}))'
          new_expect = 'self.assertEqual(weakening.REQUIRED_LIVE_CALL_PREFIXES[protected], ("validate_empirical_authority", "validate_gate"))'
          if s.count(old_expect) != 1:
              raise SystemExit(f'weakening mapping assertion count={s.count(old_expect)}')
          s = s.replace(old_expect, new_expect, 1)
          s = s.replace('"required semantic validator calls absent from live verify path"', '"required live verify call prefix changed"')
          method_anchor = '    def test_weakening_detector_includes_research_verifiers(self) -> None:\n'
          cli_test = '''    def test_legacy_cli_passes_directly_without_wrapper_patching(self) -> None:\n        completed = subprocess.run(\n            [sys.executable, str(DIR / "verify_compositional_invariant_legacy.py")],\n            cwd=ROOT,\n            text=True,\n            capture_output=True,\n            check=False,\n        )\n        self.assertEqual(completed.returncode, 0, completed.stdout + completed.stderr)\n\n'''
          if s.count(method_anchor) != 1:
              raise SystemExit('weakening method anchor drifted')
          s = s.replace(method_anchor, cli_test + method_anchor, 1)
          tail_anchor = '''            for protected in weakening.REQUIRED_SEMANTIC_CALLS:\n                self.assertIn(protected, dead_failures)\n                self.assertTrue(any("required live verify call prefix changed" in item for item in dead_failures[protected]))\n                self.assertTrue(any("required live verify call prefix changed" in item for item in failures[protected]))\n'''
          early = tail_anchor + '''\n            subprocess.run(["git", "reset", "--hard", base], cwd=repo, check=True, stdout=subprocess.DEVNULL)\n            direct = "    validate_empirical_authority(empirical_charter_path, empirical_manifest_path, audit_path)\\n"\n            early_return = "    if True:\\n        return None\\n" + direct\n            for protected in weakening.REQUIRED_SEMANTIC_CALLS:\n                target = repo / protected\n                source = target.read_text(encoding="utf-8")\n                self.assertEqual(source.count(direct), 1)\n                target.write_text(source.replace(direct, early_return, 1), encoding="utf-8")\n            subprocess.run(["git", "add", "."], cwd=repo, check=True)\n            subprocess.run(["git", "commit", "-qm", "insert conditionally terminating branch before authority calls"], cwd=repo, check=True)\n            early_report = weakening.detect_weakening(repo, base=base)\n            self.assertFalse(early_report.successful)\n            early_failures = {finding.path: finding.failures for finding in early_report.findings}\n            for protected in weakening.REQUIRED_SEMANTIC_CALLS:\n                self.assertIn(protected, early_failures)\n                self.assertTrue(any("required live verify call prefix changed" in item for item in early_failures[protected]))\n'''
          if s.count(tail_anchor) != 1:
              raise SystemExit(f'dead-branch test tail count={s.count(tail_anchor)}')
          tests.write_text(s.replace(tail_anchor, early, 1), encoding='utf-8', newline='\n')

          lock_path = Path('validation_bootstrap/assurance-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['files']['far_validation/weakening.py'] = hashlib.sha256(weak.read_bytes()).hexdigest()
          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Remove root-fix workflow from candidate
        run: rm -f .github/workflows/pr436-final-two-p2-root.yml

      - name: Create exact local candidate commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Eliminate final compositional verifier assurance gaps"
          git rev-parse HEAD

      - name: Direct legacy and public verifier checks
        run: |
          python research/target-category-discovery/verify_compositional_invariant_legacy.py >/tmp/legacy.json
          python research/target-category-discovery/verify_compositional_invariant.py >/tmp/public.json
          python validation_bootstrap/verify.py

      - name: Target-category regressions
        run: python -m unittest tests.test_target_category_compositional_invariant -v

      - name: Validation assurance tests
        run: python -m unittest discover -s tests -p 'test_validation_assurance.py' -v

      - name: Repository hygiene
        run: python tools/check_repository_hygiene.py

      - name: Canonical fast suite
        shell: bash
        run: |
          set -o pipefail
          python tools/run_tests.py --fast 2>&1 | tee /tmp/fast-suite.log

      - name: Push exact validated candidate
        run: git push origin HEAD:repair/pr436-final-two-p2-root

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr436-final-two-p2-root-diagnostics
          path: /tmp/fast-suite.log
          if-no-files-found: ignore
