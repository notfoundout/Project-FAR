name: Temporary W3 Reconciliation

on:
  push:
    branches:
      - research/pca-w3-contract-schema

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pca-w3-contract-schema
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Advance W1 metadata allowance to W4
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/far_research_registry.py')
          text = path.read_text(encoding='utf-8')
          old = '"next_workstream": "PCA-W3-CONTRACT-SCHEMA"'
          assert text.count(old) == 1, f'expected exactly one registry metadata occurrence, got {text.count(old)}'
          path.write_text(text.replace(old, '"next_workstream": "PCA-W4-DOMAIN-CONTRACTS"'), encoding='utf-8')
          PY
      - name: Regenerate governed views and export
        run: |
          python tools/generate_next_tasks.py
          python tools/far_research_registry.py --write
          python tools/export_specification.py
      - name: Focused W3/W4 validation
        run: |
          python -m unittest tests.test_far_contract_v2 tests.test_cre001_semantics tests.test_project_far_theory_closure
          python tools/check_repository_truth.py
          python tools/check_project_far_theory_closure.py
          python tools/check_final_newline.py
      - name: Remove one-shot workflow and commit reconciliation
        run: |
          rm .github/workflows/temporary-w3-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile generated W3 completion state'
          git push origin HEAD:research/pca-w3-contract-schema
