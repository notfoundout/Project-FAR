name: W6 Workspace Export

on:
  push:
    branches:
      - research/pca-w6-audit-utility

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source tree
        run: git archive --format=zip --output=project-far-source.zip HEAD
      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: w6-workspace-${{ github.sha }}
          path: project-far-source.zip
          if-no-files-found: error
          retention-days: 1
