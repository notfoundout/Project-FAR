name: W6 Git Bundle Export

on:
  push:
    branches:
      - research/pca-w6-audit-utility

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle exact branch history
        run: git bundle create project-far.bundle HEAD
      - name: Verify bundle
        run: git bundle verify project-far.bundle
      - name: Upload exact branch history
        uses: actions/upload-artifact@v4
        with:
          name: w6-git-bundle-${{ github.sha }}
          path: project-far.bundle
          if-no-files-found: error
          retention-days: 1
