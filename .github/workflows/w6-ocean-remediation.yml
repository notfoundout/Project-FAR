name: W6 Ocean Remediation

on:
  push:
    branches:
      - research/pca-w6-audit-utility

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pca-w6-audit-utility
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Decode deterministic remediation
        run: echo '' | base64 -d > /tmp/w6fix.py
      - name: Apply terminal W6 remediation
        run: python /tmp/w6fix.py
      - name: Verify focused W4 and W6 controls
        run: |
          python tools/check_pca_w4_domain_contracts.py
          python -m unittest tests.test_pca_w4_domain_contracts -v
          python -m unittest tests.test_cre001_semantics -v
          python -m unittest tests.test_pca_w6_empirical_audit_utility -v
          python tools/check_pca_w6_empirical_audit_utility.py
          python tools/check_current_state_consistency.py
          python tools/check_project_far_theory_closure.py
          python tools/check_repository_truth.py
      - name: Verify canonical fast suite
        run: python tools/run_tests.py --fast
      - name: Verify canonical fast repository health
        run: python tools/repo_health_check.py --fast
      - name: Verify W6 make target
        run: make pca-w6-check
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit and push complete remediation
        run: |
          rm .github/workflows/w6-ocean-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 1
          fi
          git commit -m "fix: close W6 merge-gate integrity gaps"
          git push origin HEAD:research/pca-w6-audit-utility
