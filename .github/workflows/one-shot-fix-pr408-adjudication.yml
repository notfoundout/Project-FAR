name: One-shot fix PR408 adjudication

on:
  push:
    branches:
      - codex/adjudicate-merged-pr-review-findings

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Correct adjudication and regenerate reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/audits/merged-pr-review-classification/manual-decisions.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target = 'PR12:PRRT_kwDOTH_vCM6OD6bY'
          for decision in data['decisions']:
              if decision['finding_id'] == target:
                  decision['disposition'] = 'resolved_incorrectly'
                  decision['evidence'] = [
                      'Current-main commit bb0a6fcbb213bcfa1616106344f50302b819c760 does not contain `research/README.md`, while `docs/README.md:29` still links to that missing research index.',
                      'Current-main commit bb0a6fcbb213bcfa1616106344f50302b819c760 retains `docs/SEMANTIC_AUDIT.md:111`, which relies on the missing research index as evidence.'
                  ]
                  decision['rationale'] = 'The reviewer concern still reproduces on the audited commit: the research index is absent, but current repository documents still link to or rely on it. The finding is therefore a confirmed defect and must remain in the remediation queue until the index is restored or all dependent references are updated.'
                  decision['risk'] = 'medium'
                  break
          else:
              raise SystemExit(f'missing finding: {target}')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python tools/classify_merged_pr_review_findings.py \
            --threads docs/audits/merged-pr-review-audit/raw-review-threads.json \
            --overrides docs/audits/merged-pr-review-classification/manual-decisions.json \
            --json-output docs/audits/merged-pr-review-classification/findings.json \
            --markdown-output docs/audits/merged-pr-review-classification/FINDINGS.md \
            --queue-output docs/audits/merged-pr-review-classification/REMEDIATION_QUEUE.md
          python -m unittest tests/test_classify_merged_pr_review_findings.py
          git diff --check
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/merged-pr-review-classification/manual-decisions.json \
                  docs/audits/merged-pr-review-classification/findings.json \
                  docs/audits/merged-pr-review-classification/FINDINGS.md \
                  docs/audits/merged-pr-review-classification/REMEDIATION_QUEUE.md
          git commit -m "Correct research-index adjudication"
          git push origin HEAD:codex/adjudicate-merged-pr-review-findings
