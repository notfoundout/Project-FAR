name: PR Validator Command Diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/pr-validator-command-diagnostic.yml'
      - '.github/workflows/validator-assurance.yml'
      - 'validation_bootstrap/assurance-lock.json'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Capture exact bootstrap and producer failures
        run: |
          set +e
          python validation_bootstrap/verify.py > "$RUNNER_TEMP/bootstrap.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bootstrap.exit-code"
          key="$(openssl rand -hex 32)"
          export FAR_VALIDATION_CACHE_SIGNING_KEY="$key"
          python -m far_validation validate bootstrap.manifest --require-signed-cache > "$RUNNER_TEMP/producer.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/producer.exit-code"
          cat "$RUNNER_TEMP/bootstrap.log"
          cat "$RUNNER_TEMP/producer.log"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr-validator-command-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bootstrap.log
            ${{ runner.temp }}/bootstrap.exit-code
            ${{ runner.temp }}/producer.log
            ${{ runner.temp }}/producer.exit-code
          retention-days: 3
