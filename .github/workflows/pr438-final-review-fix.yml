name: PR438 final review correction

on:
  push:
    branches:
      - repair/pr438-final-review-fix

permissions:
  contents: write

jobs:
  fix-validate-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: repair/pr438-final-review-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Correct path-only integrity narrative on both surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'The reviewed Git commit/tree is the immutable current root. Every governed current design artifact plus archival context is indexed exactly once by `design-manifest-v1.0.json`. The manifest records committed Git blob identity and byte count; semantic verifiers enforce complete type-exact contract invariants without copying mutable current blob IDs into verifier constants. Verifier source is deliberately excluded from the governed-artifact manifest to avoid recursive self-hashing and remains ordinary reviewed code at the exact PR head.'
          new = 'The reviewed Git commit/tree is the immutable current-byte authority. Every governed current design artifact plus archival context is indexed exactly once by `design-manifest-v1.0.json`, whose entries contain only governed paths. The manifest does not duplicate current blob identities, byte counts, hashes, or semantic digests; semantic verifiers enforce complete type-exact contract invariants while current bytes are bound solely by the reviewed Git tree. Verifier source is deliberately excluded from the governed-artifact manifest to avoid recursive self-hashing and remains ordinary reviewed code at the exact PR head.'
          paths = [
              Path('research/external-validation/swe-agent-v3/README.md'),
              Path('research/external-validation/swe-agent-v3/verify_public_narratives.py'),
          ]
          for p in paths:
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{p}: expected exactly one stale integrity paragraph, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Remove this workflow from candidate
        run: rm -f .github/workflows/pr438-final-review-fix.yml
      - name: Create exact local candidate commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Correct SWE v3 path-only authority narrative"
          git rev-parse HEAD
      - name: Governing verifiers
        run: |
          python -m compileall -q research/external-validation/swe-agent-v3 tests/test_swe_agent_v3*.py
          python research/external-validation/swe-agent-v3/verify_amendment_v1_1.py
          python research/external-validation/swe-agent-v3/verify_review_closure.py
          python research/external-validation/swe-agent-v3/verify_design.py
          python research/external-validation/swe-agent-v3/verify_integrity.py
          python research/external-validation/swe-agent-v3/verify_public_narratives.py
          python research/external-validation/swe-agent-v3/verify_public_narratives_v2.py
      - name: SWE v3 tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_swe_agent_v3*.py' -v 2>&1 | tee /tmp/swe-v3-tests.log
      - name: Repository hygiene
        run: python tools/check_repository_hygiene.py
      - name: Canonical fast suite
        shell: bash
        run: |
          set -o pipefail
          python tools/run_tests.py --fast 2>&1 | tee /tmp/fast-suite.log
      - name: Push validated candidate
        run: git push origin HEAD:repair/pr438-final-review-fix
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr438-final-review-fix-diagnostics
          path: |
            /tmp/swe-v3-tests.log
            /tmp/fast-suite.log
          if-no-files-found: ignore
