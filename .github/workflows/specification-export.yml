name: Specification Export

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  verify-specification-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest pyyaml
      - name: Regenerate Project FAR specification export
        run: python tools/export_specification.py
      - name: Commit regenerated specification export
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- exports/far-spec-v1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add exports/far-spec-v1
            git commit -m "Regenerate far-spec-v1 for core theory v1.1"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Fail if specification export is stale
        run: git diff --exit-code -- exports/far-spec-v1
      - name: Verify export tests
        run: python -m pytest tests/test_specification_export.py -q
