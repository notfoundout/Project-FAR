name: Exact Head Assurance
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact repository commit to assure
        required: true
        type: string
      base_sha:
        description: Exact protected-main comparison base
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: exact-head-assurance-${{ inputs.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAR_VALIDATION_CACHE_SIGNING_KEY: ${{ github.token }}
      FAR_VALIDATION_TRUST_DOMAIN: project-far:${{ github.repository }}
    steps:
    - name: Validate dispatched identity before checkout
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        FAR_ASSURANCE_DISPATCH_BASE: ${{ inputs.base_sha }}
        FAR_ASSURANCE_DISPATCH_HEAD: ${{ inputs.head_sha }}
        FAR_ASSURANCE_DISPATCH_WORKFLOW_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        [[ "$FAR_ASSURANCE_DISPATCH_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid dispatched exact-head SHA' >&2; exit 1; }
        [[ "$FAR_ASSURANCE_DISPATCH_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid dispatched exact-head base SHA' >&2; exit 1; }
        [[ "$FAR_ASSURANCE_DISPATCH_BASE" == "$FAR_ASSURANCE_DISPATCH_WORKFLOW_SHA" ]] || { echo 'dispatched exact-head base differs from trusted main workflow ref' >&2; exit 1; }
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        show-progress: false
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - name: Verify dispatched checkout lineage before repository code runs
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        FAR_ASSURANCE_DISPATCH_BASE: ${{ inputs.base_sha }}
        FAR_ASSURANCE_DISPATCH_HEAD: ${{ inputs.head_sha }}
      run: |
        set -euo pipefail
        [[ "$(git rev-parse HEAD^{commit})" == "$FAR_ASSURANCE_DISPATCH_HEAD" ]] || { echo 'dispatched exact-head checkout mismatch' >&2; exit 1; }
        [[ "$(git rev-parse HEAD^1)" == "$FAR_ASSURANCE_DISPATCH_BASE" ]] || { echo 'dispatched exact-head review head is not a direct child of frozen main' >&2; exit 1; }
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies and trace backend
      run: 'python -m pip install -r requirements.txt

        sudo apt-get update -qq

        sudo apt-get install -y -qq strace

        '
    - name: Resolve comparison base
      id: base
      shell: bash
      run: "set -euo pipefail\ncase \"$FAR_ASSURANCE_EVENT\" in\n  pull_request) base=\"$FAR_ASSURANCE_PR_BASE\" ;;\n  push) base=\"$FAR_ASSURANCE_PUSH_BASE\" ;;\n  workflow_dispatch) base=\"$FAR_ASSURANCE_DISPATCH_BASE\" ;;\n  *) echo \"unsupported assurance event\" >&2; exit 1 ;;\nesac\n[[ \"$base\" =~ ^[0-9a-f]{40}$ && \"$base\" != 0000000000000000000000000000000000000000 ]]\ngit cat-file -e \"${base}^{commit}\"\ngit merge-base --is-ancestor \"$base\" HEAD\necho \"sha=$base\" >> \"$GITHUB_OUTPUT\"\n"
      env:
        FAR_ASSURANCE_EVENT: ${{ github.event_name }}
        FAR_ASSURANCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
        FAR_ASSURANCE_PUSH_BASE: ${{ github.event.before }}
        FAR_ASSURANCE_DISPATCH_BASE: ${{ inputs.base_sha }}
    - name: Verify independent bootstrap
      run: python validation_bootstrap/verify.py
    - name: Run validator assurance tests
      run: python -m unittest discover -s tests -p "test_validation_assurance.py" -v
    - name: Prepare assurance artifact directory
      run: mkdir -p artifacts/validation/runtime
    - name: Run complete traced validation profile
      run: python -m far_validation validate --profile pr-full --no-cache --trace-dependencies --require-trace --require-signed-cache
    - name: Run independent legacy-checker oracle
      run: python -m far_validation oracle --json > artifacts/validation/runtime/independent-oracle.json
    - name: Detect test and validator weakening
      run: python -m far_validation weakening --base "${{ steps.base.outputs.sha }}" --json > artifacts/validation/runtime/test-weakening.json
    - name: Install pinned Lean toolchain
      shell: bash
      run: "set -euo pipefail\ncurl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \\\n  sh -s -- -y --default-toolchain \"$(cat lean-toolchain)\"\necho \"$HOME/.elan/bin\" >> \"$GITHUB_PATH\"\n"
    - name: Machine-check validation-engine assurance theorems
      shell: bash
      run: "set -euo pipefail\n\"$HOME/.elan/bin/lean\" mechanization/lean/ValidationEngine.lean\npython - <<'PY2'\nimport json\nfrom pathlib import Path\nPath('artifacts/validation/runtime/lean-proof.json').write_text(\n    json.dumps({'successful': True, 'artifact': 'mechanization/lean/ValidationEngine.lean'}, indent=2),\n    encoding='utf-8',\n)\nPY2\n"
    - name: Exhaustively model-check engine state space
      run: python -m far_validation formal --max-checks 4 --json > artifacts/validation/runtime/formal-model.json
    - name: Run complete registered mutation campaign
      run: python -m far_validation mutations --json --report artifacts/validation/runtime/mutation-campaign.json > artifacts/validation/runtime/mutation-campaign.stdout.json
    - name: Assemble signed merge-authority certificate
      run: "python tools/assemble_validation_certificate.py \\\n  --evidence independent-oracle=artifacts/validation/runtime/independent-oracle.json \\\n  --evidence test-weakening=artifacts/validation/runtime/test-weakening.json \\\n  --evidence formal-model=artifacts/validation/runtime/formal-model.json \\\n  --evidence lean-proof=artifacts/validation/runtime/lean-proof.json \\\n  --evidence mutation-campaign=artifacts/validation/runtime/mutation-campaign.json\n"
    - name: Verify exact commit and tree certificate
      run: "python -m far_validation certificate verify --require-signed \\\n  --expected-commit \"$(git rev-parse HEAD)\" \\\n  --expected-tree \"$(git rev-parse HEAD^{tree})\" \\\n  --required-check bootstrap.manifest \\\n  --required-check selection.completeness \\\n  --required-check governance.research-gates \\\n  --required-check governance.claim-boundaries \\\n  --required-check governance.w5-authorization \\\n  --required-evidence independent-oracle \\\n  --required-evidence test-weakening \\\n  --required-evidence formal-model \\\n  --required-evidence lean-proof \\\n  --required-evidence mutation-campaign\n"
    - name: Stage complete assurance bundle
      if: always()
      shell: bash
      run: "mkdir -p artifacts/validation/runtime\nif [[ -d .far ]]; then\n  rm -rf artifacts/validation/runtime/far-state\n  cp -R .far artifacts/validation/runtime/far-state\nfi\n"
    - name: Upload assurance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: exact-head-assurance-${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        path: artifacts/validation
        if-no-files-found: error
        retention-days: 30
  publish-dispatched-assurance:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: exact-head-assurance
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
    - name: Publish dispatched assurance on reviewed head
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FAR_ASSURANCE_DISPATCH_HEAD: ${{ inputs.head_sha }}
        FAR_ASSURANCE_JOB_RESULT: ${{ needs.exact-head-assurance.result }}
      run: |
        set -euo pipefail
        case "$FAR_ASSURANCE_JOB_RESULT" in
          success) conclusion=success ;;
          cancelled) conclusion=cancelled ;;
          *) conclusion=failure ;;
        esac
        details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        jq -n \
          --arg name exact-head-assurance \
          --arg head_sha "$FAR_ASSURANCE_DISPATCH_HEAD" \
          --arg conclusion "$conclusion" \
          --arg details_url "$details_url" \
          --arg title "Trusted main exact-head assurance" \
          --arg summary "Trusted workflow run $GITHUB_RUN_ID validated the dispatched review head." \
          '{name:$name,head_sha:$head_sha,status:"completed",conclusion:$conclusion,details_url:$details_url,output:{title:$title,summary:$summary}}' \
          | gh api --method POST -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/check-runs" --input -
