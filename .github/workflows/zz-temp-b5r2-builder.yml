name: TEMP B5R2 bootstrap builder

on:
  push:
    branches:
      - bootstrap/agepony-repin

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.repository == 'notfoundout/Project-FAR'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Prepare authenticated publisher checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
          path: publisher

      - name: Reconstruct, validate, freeze, and publish clean three-commit bootstrap
        shell: bash
        env:
          BASE_SHA: 7fb4816e4aa53aed749b7008b46ba9393d3d29b2
          CORE_PATCH_SHA256: f253140f39cac759b2802656981defaebf4c819c37c34a71aa25e07840d68c87
          BUILDER_SHA256: 75feb4c6ced6586a91eb25870bcdb21e23af53978e7b664b1c0cb775e0aed08d
          FAR_PUBLIC_KEY: 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBE6iAbVMbXxjyi7DQClWwBcXxspNvShob6DVLeIJtNLGLXEYq9nLQNTQo0ZNGCv46KSsK92Q9UoVOJzhfot7JCA= agepony'
          FAR_FINGERPRINT: 'SHA256:t8YBhIDQYZgtfTxQur1hQCdYMrobCp1lRVTq7PFNTco'
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/out
          trap 'rc=$?; printf "%s\n" "$rc" > /tmp/out/exit-code.txt; exit "$rc"' EXIT

          git clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/far
          cd /tmp/far
          git checkout --detach "$GITHUB_SHA"
          cat .bootstrap/input-parts/part-* > /tmp/bootstrap-build-inputs.tar.gz.b64
          echo "732501abffcd912af6fd3adceafada18e339aa1ce77ba7ea9270d1303d7773f6  /tmp/bootstrap-build-inputs.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/bootstrap-build-inputs.tar.gz.b64 > /tmp/bootstrap-build-inputs.tar.gz
          echo "4abb46f37421ae62544576c0851e896805899fd08c879508cf4c656fea171862  /tmp/bootstrap-build-inputs.tar.gz" | sha256sum -c -
          mkdir -p /tmp/bootstrap-build-inputs
          tar -xzf /tmp/bootstrap-build-inputs.tar.gz -C /tmp/bootstrap-build-inputs
          cp /tmp/bootstrap-build-inputs/bootstrap-B5-agepony-repin.patch /tmp/core.patch
          cp /tmp/bootstrap-build-inputs/b5r2_builder.py /tmp/b5r2_builder.py
          echo "$CORE_PATCH_SHA256  /tmp/core.patch" | sha256sum -c -
          echo "$BUILDER_SHA256  /tmp/b5r2_builder.py" | sha256sum -c -

          git checkout --detach "$BASE_SHA"
          git config user.name "FAR Bootstrap"
          git config user.email "far-bootstrap@users.noreply.github.com"
          git am /tmp/core.patch
          CORE=$(git rev-parse HEAD)
          CORE_TREE=$(git rev-parse 'HEAD^{tree}')
          printf '%s\n' "$CORE" > /tmp/out/core-commit.txt
          printf '%s\n' "$CORE_TREE" > /tmp/out/core-tree.txt
          python3 validation_bootstrap/verify.py | tee /tmp/out/core-bootstrap-verify.txt
          make test-fast | tee /tmp/out/core-test-fast.txt

          python3 /tmp/b5r2_builder.py | tee /tmp/out/stage-builder.txt
          git add agepony-acceptance \
            far_validation/repin_agepony_acceptance.py \
            tests/test_repin_agepony_acceptance.py \
            docs/audits/owner-authorization-agepony-threat-model-2026-09-25.md \
            docs/governance/protected-repin-procedure.md \
            validation/runtime-dependencies.json \
            validation_bootstrap/assurance-lock.json
          git diff --cached --check
          git commit -m "Add staged AgePony installed-binary acceptance"
          STAGE=$(git rev-parse HEAD)
          STAGE_TREE=$(git rev-parse 'HEAD^{tree}')
          printf '%s\n' "$STAGE" > /tmp/out/stage-commit.txt
          printf '%s\n' "$STAGE_TREE" > /tmp/out/stage-tree.txt
          python3 -m unittest -q tests.test_repin_agepony_acceptance 2>&1 | tee /tmp/out/stage-acceptance-tests.txt
          make test-fast | tee /tmp/out/stage-test-fast.txt
          python3 validation_bootstrap/verify.py | tee /tmp/out/stage-bootstrap-verify.txt

          printf '%s\n' "$FAR_PUBLIC_KEY" > /tmp/far-repin.pub
          python3 far_validation/repin_signature.py pin-key /tmp/far-repin.pub | tee /tmp/out/pin-key.txt
          grep -F "$FAR_FINGERPRINT" /tmp/out/pin-key.txt
          git add validation_bootstrap/repin-allowed-signers validation_bootstrap/assurance-lock.json
          mapfile -t PIN_PATHS < <(git diff --cached --name-only)
          test "${#PIN_PATHS[@]}" -eq 2
          printf '%s\n' "${PIN_PATHS[@]}" | sort > /tmp/out/pin-paths.txt
          diff -u <(printf '%s\n' validation_bootstrap/assurance-lock.json validation_bootstrap/repin-allowed-signers | sort) /tmp/out/pin-paths.txt
          git diff --cached --check
          git commit -m "Pin owner protected-repin key"
          PIN=$(git rev-parse HEAD)
          PIN_TREE=$(git rev-parse 'HEAD^{tree}')
          printf '%s\n' "$PIN" > /tmp/out/pin-commit.txt
          printf '%s\n' "$PIN_TREE" > /tmp/out/pin-tree.txt

          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -eq 3
          test "$(git rev-parse HEAD~3)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          grep -Fx 'far-repin-owner namespaces="agepony" ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBE6iAbVMbXxjyi7DQClWwBcXxspNvShob6DVLeIJtNLGLXEYq9nLQNTQo0ZNGCv46KSsK92Q9UoVOJzhfot7JCA=' validation_bootstrap/repin-allowed-signers

          python3 -m unittest -q tests.test_repin_agepony_acceptance 2>&1 | tee /tmp/out/pin-acceptance-tests.txt
          make test-fast | tee /tmp/out/pin-test-fast.txt
          python3 validation_bootstrap/verify.py | tee /tmp/out/pin-bootstrap-verify.txt
          make docs-check | tee /tmp/out/pin-docs-check.txt
          make links-check | tee /tmp/out/pin-links-check.txt
          make semantic-check | tee /tmp/out/pin-semantic-check.txt
          make research-check | tee /tmp/out/pin-research-check.txt
          make health-fast | tee /tmp/out/pin-health-fast.txt
          git diff --check "$BASE_SHA"..HEAD

          mapfile -t CORE_PATHS < <(git diff-tree --no-commit-id --name-only -r "$CORE")
          mapfile -t STAGE_PATHS < <(git diff-tree --no-commit-id --name-only -r "$STAGE")
          mapfile -t FINAL_PIN_PATHS < <(git diff-tree --no-commit-id --name-only -r "$PIN")
          git archive --format=tar.gz -o /tmp/out/core-state.tar.gz "$CORE" -- "${CORE_PATHS[@]}"
          git archive --format=tar.gz -o /tmp/out/stage-state.tar.gz "$STAGE" -- "${STAGE_PATHS[@]}"
          git archive --format=tar.gz -o /tmp/out/pin-state.tar.gz "$PIN" -- "${FINAL_PIN_PATHS[@]}"
          cp /tmp/core.patch /tmp/out/bootstrap-B5-agepony-repin.patch
          git format-patch -1 --stdout "$STAGE" > /tmp/out/bootstrap-B5R2-agepony-staged-acceptance.patch
          git format-patch -1 --stdout "$PIN" > /tmp/out/bootstrap-B5R2-owner-key-pin.patch
          git log --format='%H %T %P %s' "$BASE_SHA"..HEAD > /tmp/out/commit-chain.txt
          git diff --name-status "$BASE_SHA"..HEAD > /tmp/out/final-name-status.txt
          git diff --stat "$BASE_SHA"..HEAD > /tmp/out/final-stat.txt

          python3 - "$BASE_SHA" "$CORE" "$CORE_TREE" "$STAGE" "$STAGE_TREE" "$PIN" "$PIN_TREE" <<'PY'
          import hashlib, json, pathlib, sys
          out=pathlib.Path('/tmp/out')
          names=['base','core_commit','core_tree','stage_commit','stage_tree','pin_commit','pin_tree']
          record=dict(zip(names, sys.argv[1:]))
          record['core_patch_sha256']=hashlib.sha256((out/'bootstrap-B5-agepony-repin.patch').read_bytes()).hexdigest()
          record['stage_patch_sha256']=hashlib.sha256((out/'bootstrap-B5R2-agepony-staged-acceptance.patch').read_bytes()).hexdigest()
          record['pin_patch_sha256']=hashlib.sha256((out/'bootstrap-B5R2-owner-key-pin.patch').read_bytes()).hexdigest()
          record['accepted_agepony']='4.0.1 (1)'
          record['permanent_key_fingerprint']='SHA256:t8YBhIDQYZgtfTxQur1hQCdYMrobCp1lRVTq7PFNTco'
          (out/'build-record.json').write_text(json.dumps(record, indent=2, sort_keys=True)+'\n')
          with (out/'SHA256SUMS').open('w') as f:
              for p in sorted(out.iterdir()):
                  if p.name in {'SHA256SUMS','exit-code.txt'} or not p.is_file(): continue
                  f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n")
          PY

          PUB="$GITHUB_WORKSPACE/publisher"
          git -C "$PUB" remote add reconstructed /tmp/far
          git -C "$PUB" fetch reconstructed "$PIN"
          git -C "$PUB" checkout -B bootstrap/b5r2-final FETCH_HEAD
          git -C "$PUB" push origin bootstrap/b5r2-final

      - name: Upload bootstrap reconstruction record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b5r2-bootstrap-${{ github.sha }}
          path: /tmp/out
          if-no-files-found: error
          retention-days: 7
