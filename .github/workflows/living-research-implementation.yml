name: Living Research Implementation

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_run:
    workflows:
      - Living Research Watch
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: living-research-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout protected main automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install canonical repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Test implementation contract without source execution
        run: >-
          python -m unittest
          tests.test_living_implementation_contract
          tests.test_living_research_implementation_runner -v
      - name: Materialize protected-authorized implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.run_living_research_implementation
