name: PR436 Alias Root Repair

on:
  push:
    branches:
      - agent/close-structured-reasoning-compositional-question
    paths:
      - .github/workflows/pr436-alias-root-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-structured-reasoning-compositional-question
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply root repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/pr436-repair.py
          python /tmp/pr436-repair.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p = Path('far_validation/weakening.py')
          text = p.read_text(encoding='utf-8').replace('set{str]', 'set[str]')
          p.write_text(text, encoding='utf-8')
          tp = Path('tests/test_target_category_weakening_aliases.py')
          lines = tp.read_text(encoding='utf-8').splitlines()
          lines = [line + ']' if line.strip() == 'failures = [item for finding in report.findings for item in finding.failures' else line for line in lines]
          tp.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          lp = Path('validation_bootstrap/assurance-lock.json')
          lock = json.loads(lp.read_text(encoding='utf-8'))
          lock['files']['far_validation/weakening.py'] = hashlib.sha256(p.read_bytes()).hexdigest()
          lp.write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m py_compile far_validation/weakening.py tests/test_target_category_weakening_aliases.py
          rm .github/workflows/pr436-alias-root-repair.yml
          git config user.name "Project FAR Closure"
          git config user.email "actions@users.noreply.github.com"
          git add far_validation/weakening.py tests/test_target_category_weakening_aliases.py validation_bootstrap/assurance-lock.json .github/workflows/pr436-alias-root-repair.yml
          git commit -m "Harden verifier alias resolution at root"
      - name: Run focused root regressions
        run: |
          python -m unittest tests.test_target_category_weakening_aliases tests.test_target_category_validator_assurance_hardening tests.test_target_category_compositional_invariant tests.test_pr436_root_closure -v
      - name: Verify bootstrap integrity
        run: python validation_bootstrap/verify.py
      - name: Run weakening detector against current main base
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/main)"
          python -m far_validation weakening --base "$BASE"
      - name: Run complete relevant validation profile
        run: python -m far_validation validate --profile pr-full --no-cache
      - name: Push validated repair
        run: git push origin HEAD:agent/close-structured-reasoning-compositional-question
