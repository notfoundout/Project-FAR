name: PCA-W5 Approximation and Cost

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pca-w5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Installer pinned to an immutable elan commit and verified before execution.
          elan_commit=0e36a07b9bbcc5381fa6250df109f9a4f94d7bac
          elan_sha256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl -sSf "https://raw.githubusercontent.com/leanprover/elan/$elan_commit/elan-init.sh" \
            -o "$RUNNER_TEMP/elan-init.sh"
          echo "$elan_sha256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile PCA-W5 formal control
        run: lean mechanization/lean/W5ApproximationCost.lean
      - name: Recompute PCA-W5 campaign
        run: python tools/check_pca_w5_approximation_cost.py
      - name: Run PCA-W5 conformance and adversarial tests
        run: python -m unittest tests.test_pca_w5_approximation_cost -v
