name: PR438 final adversarial audit

on:
  push:
    branches:
      - repair/pr438-final-adversarial-audit

permissions:
  contents: write

jobs:
  audit-fix-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: repair/pr438-final-adversarial-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Close latent adversarial gaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('research/external-validation/swe-agent-v3/verify_review_closure.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    if type(seed) is not str or re.fullmatch(r"[0-9a-f]{64}", seed) is None or len(bytes.fromhex(seed)) != 32:\n        raise DesignError("bootstrap seed encoding drifted")\n'''
          replacement = anchor + '''    if seed != "76764013d297cadd3865295298e160a9fbb1a39833aac5860b0dfb13f54fdf87":\n        raise DesignError("frozen bootstrap seed value drifted")\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'seed verifier anchor count={s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('research/external-validation/swe-agent-v3/verify_design.py')
          s = p.read_text(encoding='utf-8')
          import_anchor = 'import verify_review_closure as review_closure\n'
          if s.count(import_anchor) != 1:
              raise SystemExit('review closure import anchor drifted')
          s = s.replace(import_anchor, import_anchor + 'import verify_public_narratives as public_narratives\n', 1)
          call_anchor = '    verify_text_boundaries()\n'
          call = '''    verify_text_boundaries()\n    try:\n        public_narratives.verify(HERE)\n    except public_narratives.NarrativeError as exc:\n        raise DesignError(f"complete public narrative contract drifted: {exc}") from exc\n'''
          if s.count(call_anchor) != 1:
              raise SystemExit(f'narrative call anchor count={s.count(call_anchor)}')
          s = s.replace(call_anchor, call, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('research/external-validation/swe-agent-v3/verify_amendment_v1_1.py')
          s = p.read_text(encoding='utf-8')
          old = '    print("PASS: amendment v1.1 validates against self-contained historical authority; execution blocked.")\n'
          new = '    print("PASS: standalone failure/arithmetic authority validates; archival context is non-authoritative; execution blocked.")\n'
          if s.count(old) != 1:
              raise SystemExit('stale amendment status message anchor drifted')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          p = Path('tests/test_swe_agent_v3_design.py')
          s = p.read_text(encoding='utf-8')
          old = '''        seed.write_text(json.dumps(data, indent=2) + "\\n", encoding="utf-8", newline="\\n")\n        # Do not refresh the design manifest or committed-byte fixture: immutable bytes drifted.\n        self.rejected()\n'''
          new = '''        seed.write_text(json.dumps(data, indent=2) + "\\n", encoding="utf-8", newline="\\n")\n        # Model the mutation as a newly committed HEAD. The semantic seed verifier\n        # must reject the changed frozen value independently of byte-identity drift.\n        self.refresh_manifest()\n        self.rejected()\n'''
          if s.count(old) != 1:
              raise SystemExit(f'seed mutation test anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Remove audit workflow from candidate
        run: rm -f .github/workflows/pr438-adversarial-audit.yml

      - name: Create exact local audit commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close final SWE v3 adversarial audit gaps"
          git rev-parse HEAD

      - name: Governing verifiers
        run: |
          python -m compileall -q research/external-validation/swe-agent-v3 tests/test_swe_agent_v3*.py
          python research/external-validation/swe-agent-v3/verify_amendment_v1_1.py
          python research/external-validation/swe-agent-v3/verify_review_closure.py
          python research/external-validation/swe-agent-v3/verify_design.py
          python research/external-validation/swe-agent-v3/verify_integrity.py
          python research/external-validation/swe-agent-v3/verify_public_narratives.py
          python research/external-validation/swe-agent-v3/verify_public_narratives_v2.py

      - name: SWE v3 tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_swe_agent_v3*.py' -v 2>&1 | tee /tmp/swe-v3-tests.log

      - name: Repository hygiene
        run: python tools/check_repository_hygiene.py

      - name: Canonical fast suite
        shell: bash
        run: |
          set -o pipefail
          python tools/run_tests.py --fast 2>&1 | tee /tmp/fast-suite.log

      - name: Push validated audit commit
        run: git push origin HEAD:repair/pr438-final-adversarial-audit

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr438-adversarial-audit-diagnostics
          path: |
            /tmp/swe-v3-tests.log
            /tmp/fast-suite.log
          if-no-files-found: ignore
