name: PR436 Assurance Root Repair V3

on:
  push:
    branches:
      - agent/close-structured-reasoning-compositional-question

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final assurance hardening
        shell: bash
        env:
          HARDENING_TEST_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast
          import base64
          import hashlib
          import os
          from pathlib import Path
          root = Path('.')
          wp = root / 'far_validation/weakening.py'
          s = wp.read_text(encoding='utf-8')
          old = '''            if isinstance(st, (ast.FunctionDef, ast.AsyncFunctionDef)):\n                if st.name in protected:\n                    events[st.name].append("function")\n                continue\n            if isinstance(st, ast.ClassDef):\n                if st.name in protected:\n                    events[st.name].append("class")\n                continue\n'''
          new = '''            if isinstance(st, (ast.FunctionDef, ast.AsyncFunctionDef)):\n                if st.name in protected:\n                    events[st.name].append("function")\n                for decorator in st.decorator_list:\n                    scan_expr(decorator)\n                for default in (*st.args.defaults, *[item for item in st.args.kw_defaults if item is not None]):\n                    scan_expr(default)\n                for arg in (*st.args.posonlyargs, *st.args.args, *st.args.kwonlyargs):\n                    if arg.annotation is not None:\n                        scan_expr(arg.annotation)\n                if st.args.vararg is not None and st.args.vararg.annotation is not None:\n                    scan_expr(st.args.vararg.annotation)\n                if st.args.kwarg is not None and st.args.kwarg.annotation is not None:\n                    scan_expr(st.args.kwarg.annotation)\n                if st.returns is not None:\n                    scan_expr(st.returns)\n                continue\n            if isinstance(st, ast.ClassDef):\n                if st.name in protected:\n                    events[st.name].append("class")\n                for decorator in st.decorator_list:\n                    scan_expr(decorator)\n                for base in st.bases:\n                    scan_expr(base)\n                for keyword in st.keywords:\n                    scan_expr(keyword.value)\n                continue\n'''
          if old not in s:
              raise SystemExit('definition scan anchor missing')
          s = s.replace(old, new, 1)
          definitions = {
              'research/target-category-discovery/verify_compositional_invariant.py': ('validate_gate',),
              'research/target-category-discovery/verify_compositional_invariant_legacy.py': ('validate_empirical_authority', 'validate_gate'),
          }
          def fdigest(path, name):
              tree = ast.parse((root / path).read_text(encoding='utf-8'), filename=path)
              nodes = [n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name == name]
              if len(nodes) != 1:
                  raise SystemExit(f'expected one {name} in {path}')
              return hashlib.sha256(ast.dump(nodes[0], annotate_fields=True, include_attributes=False).encode()).hexdigest()
          digests = {p:{n:fdigest(p,n) for n in names} for p,names in definitions.items()}
          marker = '@dataclass\nclass StrengthMetrics:'
          s = s.replace(marker, 'EXPECTED_PROTECTED_IMPLEMENTATION_DIGESTS: dict[str, dict[str, str]] = ' + repr(digests) + '\n\n\n' + marker, 1)
          helpers = '''def _protected_implementation_digest(source: str, path: str, function_name: str) -> str | None:\n    tree = ast.parse(source, filename=path)\n    nodes = [n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name == function_name]\n    if len(nodes) != 1:\n        return None\n    return hashlib.sha256(ast.dump(nodes[0], annotate_fields=True, include_attributes=False).encode()).hexdigest()\n\n\ndef _protected_implementation_failures(source: str, path: str) -> list[str]:\n    failures: list[str] = []\n    for name, expected in EXPECTED_PROTECTED_IMPLEMENTATION_DIGESTS.get(path, {}).items():\n        actual = _protected_implementation_digest(source, path, name)\n        if actual != expected:\n            failures.append(f"protected validator implementation changed for {name}: expected {expected}; got {actual or '<missing-or-ambiguous>'}")\n    return failures\n\n\ndef _definition_time_execution_failures(source: str, path: str) -> list[str]:\n    if path not in REQUIRED_SEMANTIC_CALLS:\n        return []\n    tree = ast.parse(source, filename=path)\n    failures: list[str] = []\n    for node in tree.body:\n        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.decorator_list:\n            failures.append(f"protected verifier definition-time decorator rejected: {getattr(node, 'name', '<definition>')}")\n    return failures\n\n\n'''
          anchor = 'def analyze(source: str, path: str) -> StrengthMetrics:\n'
          if anchor not in s:
              raise SystemExit('analyze anchor missing')
          s = s.replace(anchor, helpers + anchor, 1)
          call = '            finding.failures.extend(_binding_integrity_failures(after_source, path))\n'
          if call not in s:
              raise SystemExit('binding call anchor missing')
          s = s.replace(call, call + '            finding.failures.extend(_definition_time_execution_failures(after_source, path))\n            finding.failures.extend(_protected_implementation_failures(after_source, path))\n', 1)
          s = s.replace('import ast\nimport json\n', 'import ast\nimport hashlib\nimport json\n', 1)
          wp.write_text(s, encoding='utf-8')
          (root/'tests/test_target_category_validator_assurance_hardening.py').write_bytes(base64.b64decode(os.environ['HARDENING_TEST_B64']))
          for rel in ('.github/workflows/pr436-assurance-root-repair.yml','.github/workflows/pr436-assurance-root-repair-v2.yml','.github/workflows/pr436-assurance-root-repair-v3.yml'):
              p=Path(rel)
              if p.exists(): p.unlink()
          PY
      - name: Run focused validation
        run: |
          set -euo pipefail
          python -m unittest tests.test_target_category_compositional_invariant -v
          python -m unittest tests.test_target_category_validator_assurance_hardening -v
          python -m far_validation weakening
      - name: Run repository validation
        run: python -m far_validation run --profile pr-fast --trace-mode required
      - name: Commit and push validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden protected validator assurance at root'
          git push
