name: W5 Review Remediation

on:
  push:
    branches:
      - codex/execute-w5-implementation-as-single-pr

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/execute-w5-implementation-as-single-pr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply deterministic remediation
        run: |
          echo '' | base64 -d > /tmp/w5-remediate.py
          python /tmp/w5-remediate.py
      - name: Run W5 semantic and manifest adversarial tests
        run: python -m unittest tests.test_pca_w5_approximation_cost -v
      - name: Recompute complete W5 campaign
        run: python tools/check_pca_w5_approximation_cost.py
      - name: Preserve W4 frozen campaign integrity
        run: python tools/check_pca_w4_domain_contracts.py
      - name: Run canonical fast test suite
        run: python tools/run_tests.py --fast
      - name: Commit verified remediation
        run: |
          if git diff --quiet -- mechanization/far_mechanization/contract_v21.py research/results/pca-w5-approximation-and-cost/manifest.json; then
            echo 'remediation already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mechanization/far_mechanization/contract_v21.py research/results/pca-w5-approximation-and-cost/manifest.json
          git commit -m 'fix: close W5 adversarial review gaps'
          git push origin HEAD:codex/execute-w5-implementation-as-single-pr
