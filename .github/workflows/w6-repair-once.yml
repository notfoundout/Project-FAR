name: W6 One-Shot Repair

on:
  push:
    branches:
      - research/pca-w6-audit-utility

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pca-w6-audit-utility
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate terminal next actions
        run: python tools/generate_next_tasks.py
      - name: Rebind governed W4 support hashes to the synchronized tree
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          path = root / 'research/results/pca-w4-domain-contracts/manifest.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))
          for item in manifest['supporting_artifacts']:
              rel = item['path']
              artifact = root / rel
              if not artifact.is_file():
                  raise SystemExit(f'missing governed W4 support artifact: {rel}')
              item['sha256'] = hashlib.sha256(artifact.read_bytes()).hexdigest()
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Build exact W6 artifact manifest
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          root = Path('.')
          checker_path = root / 'tools/check_pca_w6_empirical_audit_utility.py'
          spec = importlib.util.spec_from_file_location('pca_w6', checker_path)
          assert spec is not None and spec.loader is not None
          w6 = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(w6)

          def digest(rel: str) -> str:
              artifact = root / rel
              if not artifact.is_file():
                  raise SystemExit(f'missing required W6 artifact: {rel}')
              return hashlib.sha256(artifact.read_bytes()).hexdigest()

          manifest = {
              'schema_version': '1.0',
              'campaign': 'PCA-W6-EMPIRICAL-AUDIT-UTILITY',
              'status': 'COMPLETE_BOUNDED_INTERNAL_CONTROL',
              'protocol_freeze_commit': w6.PROTOCOL_FREEZE_COMMIT,
              'protocol_base_commit': w6.PROTOCOL_BASE_COMMIT,
              'artifacts': [
                  {'path': rel, 'sha256': digest(rel)}
                  for rel in w6.EXPECTED_ARTIFACTS
              ],
          }
          output = root / 'research/results/pca-w6-empirical-audit-utility/manifest.json'
          output.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify regenerated governed state
        run: |
          python tools/check_pca_w4_domain_contracts.py
          python tools/check_pca_w6_empirical_audit_utility.py
          python tools/check_current_state_consistency.py
          python -m unittest tests.test_current_state_consistency tests.test_pca_w4_domain_contracts tests.test_pca_w6_empirical_audit_utility tests.test_project_far_theory_closure tests.test_repository_truth -v
      - name: Commit deterministic repair artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/planning/next-actions.md research/results/pca-w4-domain-contracts/manifest.json research/results/pca-w6-empirical-audit-utility/manifest.json
          if git diff --cached --quiet; then
            echo 'No repair artifacts changed'
          else
            git commit -m 'governance: regenerate terminal W6 evidence bindings'
            git push origin HEAD:research/pca-w6-audit-utility
          fi
      - name: Run canonical fast tests on repaired commit
        run: python tools/run_tests.py --fast
      - name: Run canonical fast repository health on repaired commit
        run: python tools/repo_health_check.py --fast
