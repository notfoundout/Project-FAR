name: W4 Hash Probe

on:
  push:
    branches:
      - codex/execute-w5-implementation-as-single-pr

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/execute-w5-implementation-as-single-pr
          fetch-depth: 0
      - name: Recompute every W4 supporting-artifact hash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest_path = Path('research/results/pca-w4-domain-contracts/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest.get('supporting_artifacts', []):
              path = Path(item['path'])
              if not path.is_file():
                  raise SystemExit(f'missing supporting artifact: {path}')
              item['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate W4 campaign after reconciliation
        run: python tools/check_pca_w4_domain_contracts.py
      - name: Commit exact reconciliation when needed
        run: |
          if git diff --quiet -- research/results/pca-w4-domain-contracts/manifest.json; then
            echo 'W4 manifest already exact'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/pca-w4-domain-contracts/manifest.json
          git commit -m 'fix: reconcile W4 supporting artifact hashes'
          git push origin HEAD:codex/execute-w5-implementation-as-single-pr
