name: W4 Hash Probe

on:
  push:
    branches:
      - codex/execute-w5-implementation-as-single-pr

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch W4 supporting-artifact hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest_path = Path('research/results/pca-w4-domain-contracts/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          targets = {
              'tests/test_pca_w4_domain_contracts.py': hashlib.sha256(Path('tests/test_pca_w4_domain_contracts.py').read_bytes()).hexdigest(),
              'tools/check_pca_w4_domain_contracts.py': hashlib.sha256(Path('tools/check_pca_w4_domain_contracts.py').read_bytes()).hexdigest(),
          }
          seen = set()
          for item in manifest.get('supporting_artifacts', []):
              path = item.get('path')
              if path in targets:
                  item['sha256'] = targets[path]
                  seen.add(path)
          missing = set(targets) - seen
          if missing:
              raise SystemExit(f'missing manifest entries: {sorted(missing)}')
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          for path, digest in targets.items():
              print(digest, path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w4-patched-manifest
          path: research/results/pca-w4-domain-contracts/manifest.json
          if-no-files-found: error
          retention-days: 1
