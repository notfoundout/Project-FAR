name: PR436 Root Assurance Repair
on:
  push:
    branches: [agent/close-structured-reasoning-compositional-question]
    paths:
      - .github/workflows/pr436-root-assurance-repair.yml
      - tools/pr436_root_assurance_repair.py
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/close-structured-reasoning-compositional-question
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply root repair
        run: python tools/pr436_root_assurance_repair.py
      - name: Remove temporary repair machinery
        run: rm .github/workflows/pr436-root-assurance-repair.yml tools/pr436_root_assurance_repair.py
      - name: Run focused and repository validation
        run: |
          python -m unittest tests.test_target_category_validator_assurance_hardening tests.test_weakening_namespace_rebinding tests.test_target_category_compositional_invariant tests.test_pr436_root_closure -v
          python validation_bootstrap/verify.py
          python tools/run_tests.py --fast
          python tools/check_repository_hygiene.py
          python tools/repo_health_check.py --full
          python -m far_validation weakening --base "${{ github.event.before }}"
      - name: Commit and push validated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Harden validator assurance against dynamic rebinding'
          git push origin HEAD:agent/close-structured-reasoning-compositional-question
