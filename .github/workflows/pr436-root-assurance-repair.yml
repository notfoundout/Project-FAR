name: PR436 Root Assurance Repair

on:
  push:
    branches:
      - agent/close-structured-reasoning-compositional-question
    paths:
      - .github/workflows/pr436-root-assurance-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-structured-reasoning-compositional-question
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply root assurance repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('far_validation/weakening.py')
          text = path.read_text(encoding='utf-8')

          old = '    protected = REQUIRED_SEMANTIC_CALLS.get(path, frozenset())\n'
          new = '    protected = frozenset(set(REQUIRED_SEMANTIC_CALLS.get(path, frozenset())) | set(EXPECTED_PROTECTED_IMPLEMENTATION_DIGESTS.get(path, {})))\n'
          if text.count(old) != 1:
              raise SystemExit('protected-set anchor drifted')
          text = text.replace(old, new, 1)

          old = '''def _binding_integrity_failures(source: str, path: str) -> list[str]:
    expected = REQUIRED_MODULE_BINDING_SIGNATURES.get(path)
    if expected is None:
        return []
    actual = _module_scope_binding_signatures(source, path)
'''
          new = '''def _binding_integrity_failures(source: str, path: str) -> list[str]:
    expected = dict(REQUIRED_MODULE_BINDING_SIGNATURES.get(path, {}))
    for name in EXPECTED_PROTECTED_IMPLEMENTATION_DIGESTS.get(path, {}):
        expected.setdefault(name, ("function",))
    if not expected:
        return []
    actual = _module_scope_binding_signatures(source, path)
'''
          if text.count(old) != 1:
              raise SystemExit('binding-integrity anchor drifted')
          text = text.replace(old, new, 1)

          start = text.index('def _definition_time_execution_failures(')
          end = text.index('\ndef analyze(', start)
          replacement = '''def _definition_time_execution_failures(source: str, path: str) -> list[str]:
    """Reject dynamic execution on protected verifier source.

    Validator assurance must be structural and inspectable. Dynamic code execution
    can rebind protected validators/helpers from module or class definition-time
    scopes without producing a statically attributable binding event, so it is
    prohibited anywhere in these verifier modules. This deliberately applies to
    exec/eval/compile rather than trying to reason about attacker-controlled code
    strings.
    """
    if path not in REQUIRED_SEMANTIC_CALLS:
        return []
    tree = ast.parse(source, filename=path)
    failures: list[str] = []
    for node in ast.walk(tree):
        if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in {"exec", "eval", "compile"}:
            failures.append(f"dynamic execution rejected in protected verifier: {node.func.id}")
        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.decorator_list:
            failures.append(f"protected verifier definition-time decorator rejected: {getattr(node, 'name', '<definition>')}")
    return failures

'''
          text = text[:start] + replacement + text[end+1:]
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_target_category_validator_assurance_hardening.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          if tests.count(anchor) != 1:
              raise SystemExit('test append anchor drifted')
          additions = r'''

    def test_class_body_dynamic_exec_rebinding_is_rejected(self) -> None:
        tmp, repo, base = self._repo()
        self.addCleanup(tmp.cleanup)
        for protected in weakening.REQUIRED_SEMANTIC_CALLS:
            target = repo / protected
            text = target.read_text(encoding="utf-8")
            mutation = (
                "\nclass _FarDefinitionTimeAttack:\n"
                "    exec(\"globals()['validate_empirical_authority'] = lambda *a, **k: None\")\n"
                "    exec(\"globals()['validate_gate'] = lambda *a, **k: None\")\n"
            )
            target.write_text(text + mutation, encoding="utf-8")
        report = self._commit_and_report(repo, base, "class-body dynamic execution attack")
        self.assertFalse(report.successful)
        checked = 0
        for finding in report.findings:
            if finding.path in weakening.REQUIRED_SEMANTIC_CALLS:
                checked += 1
                self.assertTrue(any("dynamic execution rejected" in item for item in finding.failures))
        self.assertEqual(checked, len(weakening.REQUIRED_SEMANTIC_CALLS))

    def test_protected_helper_rebinding_is_rejected(self) -> None:
        tmp, repo, base = self._repo()
        self.addCleanup(tmp.cleanup)
        legacy_rel = "research/target-category-discovery/verify_compositional_invariant_legacy.py"
        legacy = repo / legacy_rel
        text = legacy.read_text(encoding="utf-8")
        text += "\n_git_blob_sha1 = lambda raw: type('_Digest', (), {'__eq__': lambda self, other: True})()\n"
        legacy.write_text(text, encoding="utf-8")
        report = self._commit_and_report(repo, base, "protected helper rebinding attack")
        self.assertFalse(report.successful)
        failures = next(f.failures for f in report.findings if f.path == legacy_rel)
        self.assertTrue(any("protected validator binding changed for _git_blob_sha1" in item for item in failures))

    def test_verify_early_return_after_authority_prefix_is_rejected(self) -> None:
        tmp, repo, base = self._repo()
        self.addCleanup(tmp.cleanup)
        legacy_rel = "research/target-category-discovery/verify_compositional_invariant_legacy.py"
        legacy = repo / legacy_rel
        text = legacy.read_text(encoding="utf-8")
        needle = "    validate_gate(gates_path)\n    actual = build_result(load_json(spec_path))\n"
        self.assertEqual(text.count(needle), 1)
        legacy.write_text(text.replace(needle, "    validate_gate(gates_path)\n    return {}\n    actual = build_result(load_json(spec_path))\n", 1), encoding="utf-8")
        report = self._commit_and_report(repo, base, "verify post-prefix early-return attack")
        self.assertFalse(report.successful)
        failures = next(f.failures for f in report.findings if f.path == legacy_rel)
        self.assertTrue(any("protected validator implementation changed for verify" in item for item in failures))
'''
          tests = tests.replace(anchor, additions + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run focused assurance tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_target_category_validator_assurance_hardening \
            tests.test_weakening_namespace_rebinding \
            tests.test_target_category_compositional_invariant \
            tests.test_pr436_root_closure -v

      - name: Run canonical weakening gate
        run: |
          set -euo pipefail
          python -m far_validation weakening --base 8409bc5c4363f9151b448a9f1f31684d9d247617

      - name: Remove one-shot workflow and commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr436-root-assurance-repair.yml
          git config user.name 'project-far-repair'
          git config user.email 'project-far-repair@example.invalid'
          git add far_validation/weakening.py tests/test_target_category_validator_assurance_hardening.py .github/workflows/pr436-root-assurance-repair.yml
          git diff --cached --check
          git commit -m 'Harden validator assurance against dynamic rebinding'
          git push origin HEAD:agent/close-structured-reasoning-compositional-question
